# Harbour Donair — Netlify. Nitro's netlify preset writes static files to dist
# and the server function to .netlify/functions-internal. NETLIFY=true is set by
# the build image, which switches vite.config.ts off the Vercel preset.
[build]
  command = "npm run build && node scripts/publish-game-css.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
