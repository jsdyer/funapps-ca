<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shell Shocked: Harbourfront Lobster Rush</title>
<meta name="description" content="Crack it, pick it, eat it. A Halifax waterfront lobster feed against the clock, and the gulls.">
<meta name="theme-color" content="#16384d">
<meta property="og:title" content="Shell Shocked: Harbourfront Lobster Rush">
<meta property="og:description" content="Crack it, pick it, eat it. Don't let the gulls get your lobster.">

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#16384d;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{display:block;touch-action:none;cursor:pointer}
</style>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="icon" href="favicon.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const W = 420, H = 760;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let dpr = 1, cw = 0, ch = 0, sc = 1, ox = 0, oy = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = innerWidth; ch = innerHeight;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  sc = Math.min(cw / W, ch / H);
  ox = (cw - W * sc) / 2; oy = (ch - H * sc) / 2;
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
const lerp = (a, b, u) => a + (b - a) * u;
const FONT = '"Arial Black","Arial Bold",Gadget,system-ui,sans-serif';

/* ---------------- audio ---------------- */
let AC = null, muted = false;
try { muted = localStorage.getItem('ss_muted') === '1'; } catch (e) {}
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function env(g, t0, vol, dur) {
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
}
function noise(dur, freq, q, vol, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay, n = Math.max(1, Math.floor(AC.sampleRate * dur));
  const b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); env(g, t0, vol, dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t0); s.stop(t0 + dur + 0.05);
}
function tone(f0, f1, dur, type, vol, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = AC.createGain(); env(g, t0, vol, dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const sfx = {
  crack(big) { if (big) { noise(0.2, 800, 1.1, 0.9); noise(0.12, 300, 1, 0.6, 0.03); } else noise(0.07, rand(1800, 3400), 3, 0.55); },
  pick() { tone(2600, 1900, 0.05, 'square', 0.05); noise(0.05, 5200, 4, 0.25); },
  nom() { tone(330, 170, 0.09, 'sine', 0.4); tone(270, 140, 0.1, 'sine', 0.32, 0.1); },
  caw() { tone(980, 620, 0.16, 'sawtooth', 0.1); tone(920, 560, 0.22, 'sawtooth', 0.1, 0.2); },
  squirt() { noise(0.3, 1100, 0.7, 0.5); },
  plop() { tone(200, 90, 0.07, 'sine', 0.25); },
  chime() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.2, 'triangle', 0.18, i * 0.08)); },
  bad() { tone(320, 140, 0.3, 'square', 0.07); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, f * 0.98, 0.28, 'triangle', 0.2, i * 0.17)); }
};

/* ---------------- game state ---------------- */
let best = 0;
try { best = +localStorage.getItem('ss_best') || 0; } catch (e) {}
let G, T = 0;

const LCX = W / 2, LCY = 410;          // lobster rest position
const BUTTER = { x: 72, y: 705 };

function makeLobster(lv) {
  const m = 1 + lv * 0.13, hp = b => Math.max(1, Math.round(b * m));
  const parts = [];
  for (const s of [-1, 1]) {
    parts.push({ type: 'claw', side: s, x: 88 * s, y: -158, rx: 34, ry: 50, rot: 0.38 * s, hp: hp(s < 0 ? 7 : 6), stuck: Math.random() < 0.65 ? 2 : 0, value: 30 });
    parts.push({ type: 'knuckle', side: s, x: 56 * s, y: -90, rx: 19, ry: 13, rot: -0.9 * s, hp: hp(3), stuck: 0, value: 15 });
    for (let i = 0; i < 4; i++) {
      const ly = -38 + i * 20;
      parts.push({ type: 'leg', side: s, x: 62 * s, y: ly + 9, rx: 16, ry: 10, rot: 0.3 * s, hp: 1, stuck: 0, value: 5, ly });
    }
  }
  parts.push({ type: 'tail', side: 0, x: 0, y: 108, rx: 36, ry: 78, rot: 0, hp: hp(6), stuck: Math.random() < 0.45 ? 2 : 0, value: 40 });
  parts.forEach(p => { p.maxHp = p.hp; p.cracks = []; p.state = 'whole'; p.shake = 0; p.flash = 0; });
  return { parts, x: W + 280, tx: LCX, y: LCY, leaving: false, done: false, doneT: 0 };
}

function newGame() {
  G = {
    mode: 'play', started: false, time: 40, score: 0, cleared: 0, level: 0,
    lob: makeLobster(0), meats: [], gulls: [], fx: [], pops: [], splats: [], tools: [],
    shake: 0, combo: 0, lastEat: -9, overT: 0, hint: 'crack', seen: { crack: 1 }, patrolT: 2.2,
    stolen: 0, bites: 0, newBest: false
  };
}
newGame();

function showHint(h) { if (!G.seen[h]) { G.seen[h] = 1; G.hint = h; } }
function clearHint(h) { if (G.hint === h) G.hint = null; }
function pop(x, y, text, color = '#fff', size = 20, dur = 0.9) { G.pops.push({ x, y, text, color, size, t: 0, dur }); }

function majorDone(L) { return L.parts.every(p => p.type === 'leg' || p.state === 'empty'); }

function partWorld(p) { const L = G.lob; return [L.x + p.x, L.y + p.y]; }
function toLocal(p, wx, wy) {
  const [px, py] = partWorld(p), dx = wx - px, dy = wy - py;
  const c = Math.cos(-p.rot), s = Math.sin(-p.rot);
  return [dx * c - dy * s, dx * s + dy * c];
}

function addCrack(p, lx, ly) {
  const pts = [[lx, ly]]; let a = rand(0, Math.PI * 2), x = lx, y = ly;
  const n = p.type === 'leg' ? 2 : 4;
  for (let i = 0; i < n; i++) { a += rand(-0.9, 0.9); const l = rand(7, 14); x += Math.cos(a) * l; y += Math.sin(a) * l; pts.push([x, y]); }
  p.cracks.push(pts);
  if (Math.random() < 0.5) { // branch
    const b = pts[1 + Math.floor(Math.random() * (pts.length - 1))]; let a2 = a + rand(1, 2), bx = b[0], by = b[1]; const br = [[bx, by]];
    for (let i = 0; i < 2; i++) { a2 += rand(-0.6, 0.6); bx += Math.cos(a2) * rand(6, 10); by += Math.sin(a2) * rand(6, 10); br.push([bx, by]); }
    p.cracks.push(br);
  }
}

function shards(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(80, 260);
    G.fx.push({ type: 'shard', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, rot: rand(0, 6), vr: rand(-12, 12), life: rand(0.5, 0.9), max: 0.9, size: rand(3, 7), color: color || pick(['#d8432a', '#b8321f', '#f06a45', '#8e2414']) });
  }
}
function feathers(x, y) {
  for (let i = 0; i < 9; i++) G.fx.push({ type: 'feather', x: x + rand(-10, 10), y: y + rand(-10, 10), vx: rand(-90, 90), vy: rand(-120, 20), rot: rand(0, 6), vr: rand(-4, 4), life: rand(0.9, 1.5), max: 1.5, size: rand(4, 7) });
}
function tool(x, y, kind) { G.tools.push({ x, y, kind, t: 0 }); }

function squirt() {
  const blobs = [];
  const cx = rand(80, W - 80), cy = rand(220, 600);
  for (let i = 0; i < 10; i++) blobs.push({ dx: rand(-70, 70), dy: rand(-70, 70), r: rand(8, 30) });
  G.splats.push({ x: cx, y: cy, life: 2.4, max: 2.4, blobs });
  pop(cx, cy - 40, 'SQUIRT!', '#fff3b0', 30, 1.1);
  sfx.squirt();
}

function release(p) {
  const [px, py] = partWorld(p);
  let dx = p.x, dy = p.y + 20; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
  const k = rand(48, 72);
  const tx = clamp(px + dx * k + rand(-18, 18), 40, W - 40);
  const ty = clamp(py + dy * k + rand(-18, 18), 230, 650);
  const sz = { claw: [20, 15], tail: [27, 13], knuckle: [12, 9], leg: [10, 4] }[p.type];
  G.meats.push({ type: p.type, x: px, y: py, x0: px, y0: py, x1: tx, y1: ty, t: 0, dur: 0.45, state: 'fly', w: sz[0], h: sz[1], value: p.value, age: 0, rot: rand(-0.6, 0.6), gull: null });
  if (p.type !== 'leg') pop(px, py - 20, pick(['CRACKED!', 'FINALLY!', 'MEAT!', 'GOT IT!']), '#ffe066', 24);
}

function hitPart(p, lx, ly, wx, wy) {
  G.started = true; clearHint('crack');
  if (p.state === 'whole') {
    p.hp--; p.shake = 0.18; p.flash = 0.08;
    addCrack(p, lx, ly);
    tool(wx, wy, p.type === 'leg' ? 'pick' : 'cracker');
    if (p.hp <= 0) {
      sfx.crack(p.type !== 'leg');
      shards(wx, wy, p.type === 'leg' ? 5 : 14);
      G.shake = Math.max(G.shake, p.type === 'leg' ? 0.05 : 0.2);
      for (let i = 0; i < 3; i++) addCrack(p, rand(-p.rx, p.rx) * 0.5, rand(-p.ry, p.ry) * 0.5);
      if (p.stuck > 0) {
        p.state = 'stuck';
        pop(wx, wy - 34, pick(['STUCK!', "IT WON'T BUDGE", 'ARGH. STUCK.']), '#ffd34d', 22);
        showHint('stuck');
      } else { p.state = 'empty'; release(p); }
      if (p.type !== 'leg' && Math.random() < 0.25) squirt();
    } else {
      sfx.crack(false); shards(wx, wy, 4);
      if (p.hp === 1 && p.maxHp > 2) pop(wx, wy - 30, pick(['almost...', 'so close', 'one more!']), '#fff', 17);
      else if (Math.random() < 0.3) pop(wx, wy - 30, pick(['crack', 'CRUNCH', 'ugh', 'come ON', 'tough one', 'hnnng', 'why so hard']), '#fff', 16);
    }
  } else if (p.state === 'stuck') {
    p.stuck--; p.shake = 0.12; tool(wx, wy, 'pick'); sfx.pick();
    if (p.stuck <= 0) { p.state = 'empty'; release(p); clearHint('stuck'); }
    else pop(wx, wy - 30, pick(['wiggle...', 'pick pick pick', 'nearly...']), '#fff', 16);
  }
}

function eat(m) {
  G.started = true;
  if (m.gull) { const g = m.gull; g.m = null; g.state = 'leave'; g.vx = g.face * 200; g.vy = -220; m.gull = null; }
  m.state = 'eat'; m.t = 0; m.ex = m.x; m.ey = m.y;
  G.combo = (T - G.lastEat < 1.4) ? G.combo + 1 : 1; G.lastEat = T;
  const mult = Math.min(G.combo, 5), pts = m.value * mult;
  G.score += pts; G.bites++;
  pop(m.x, m.y - 20, '+' + pts, '#ffe066', 22);
  if (mult >= 2) pop(m.x, m.y - 46, 'x' + mult + ' COMBO', '#7ef0ff', 18);
  sfx.nom(); clearHint('eat');
}

function spawnGull(m, patrol) {
  const fromRight = patrol ? Math.random() < 0.5 : m.x < W / 2;
  const g = { x: fromRight ? W + 60 : -60, y: patrol ? rand(240, 480) : rand(110, 200), face: fromRight ? -1 : 1, flap: rand(0, 6), m: m || null, state: patrol ? 'patrol' : 'approach', vx: 0, vy: 0, carry: null, base: 0 };
  if (patrol) { g.vx = g.face * rand(150, 200); g.base = g.y; }
  else { m.gull = g; sfx.caw(); showHint('gull'); }
  G.gulls.push(g);
}

function shoo(g) {
  G.started = true;
  if (g.m) { g.m.gull = null; g.m.age = 0; g.m = null; }
  g.state = 'scared'; g.vx = (g.x < W / 2 ? -1 : 1) * 430; g.vy = -320; g.face = Math.sign(g.vx);
  G.score += 5; pop(g.x, g.y - 30, pick(['SHOO!', 'GET LOST!', 'SCRAM!', 'BEAT IT!']) + ' +5', '#fff', 20);
  feathers(g.x, g.y); sfx.caw(); clearHint('gull');
}

function gameOver() {
  G.mode = 'over'; G.overT = 0;
  if (G.score > best) { best = G.score; G.newBest = true; try { localStorage.setItem('ss_best', best); } catch (e) {} }
  sfx.over();
}

/* ---------------- input ---------------- */
function tap(x, y) {
  if (Math.hypot(x - (W - 24), y - 22) < 22) { muted = !muted; try { localStorage.setItem('ss_muted', muted ? '1' : '0'); } catch (e) {} return; }
  if (G.mode === 'over') { if (G.overT > 0.9) newGame(); return; }
  for (let i = G.gulls.length - 1; i >= 0; i--) {
    const g = G.gulls[i];
    if ((g.state === 'approach' || g.state === 'dive' || g.state === 'patrol') && Math.hypot(g.x - x, g.y - y) < 46) { shoo(g); return; }
  }
  for (let i = G.meats.length - 1; i >= 0; i--) {
    const m = G.meats[i];
    if ((m.state === 'rest' || m.state === 'fly') && Math.hypot(m.x - x, m.y - y) < Math.max(28, m.w + 12)) { eat(m); return; }
  }
  const L = G.lob;
  if (!L.leaving && Math.abs(L.x - L.tx) < 40) {
    for (const p of L.parts) {
      if (p.state === 'empty') continue;
      const [lx, ly] = toLocal(p, x, y), k = p.type === 'leg' ? 1.7 : 1.2;
      if ((lx / p.rx) ** 2 + (ly / p.ry) ** 2 <= k) { hitPart(p, lx, ly, x, y); return; }
    }
    const bx = x - L.x, by = y - (L.y - 18);
    if ((bx / 42) ** 2 + (by / 60) ** 2 <= 1) { pop(x, y - 26, pick(['nothing in there', 'try the claws', 'just shell...']), '#ddd', 15); sfx.plop(); return; }
  }
  G.fx.push({ type: 'ring', x, y, life: 0.3, max: 0.3 });
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  tap((e.clientX - ox) / sc, (e.clientY - oy) / sc);
}, { passive: false });
addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && G.mode === 'over' && G.overT > 0.9) newGame(); });
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------------- update ---------------- */
function moveToward(g, tx, ty, sp, dt) {
  const dx = tx - g.x, dy = ty - g.y, d = Math.hypot(dx, dy);
  if (Math.abs(dx) > 3) g.face = Math.sign(dx);
  if (d <= sp * dt) { g.x = tx; g.y = ty; return true; }
  g.x += dx / d * sp * dt; g.y += dy / d * sp * dt; return false;
}

function update(dt) {
  const L = G.lob;
  if (G.mode === 'play' && G.started) {
    G.time -= dt;
    if (G.time <= 0) { G.time = 0; gameOver(); }
  }
  if (G.mode === 'over') G.overT += dt;
  G.shake = Math.max(0, G.shake - dt);

  // lobster
  L.x += (L.tx - L.x) * Math.min(1, dt * (L.leaving ? 4.5 : 6));
  if (!L.done && majorDone(L)) {
    L.done = true; L.doneT = 0.7;
    if (G.mode === 'play') {
      G.cleared++; G.time += 7;
      pop(W / 2, 250, 'LOBSTER #' + G.cleared + ' DONE!', '#ffe066', 28, 1.4);
      pop(W / 2, 285, '+7 SECONDS', '#7ef0ff', 20, 1.4);
      sfx.chime();
    }
  }
  if (L.done && !L.leaving) { L.doneT -= dt; if (L.doneT <= 0) { L.leaving = true; L.tx = -300; } }
  if (L.leaving && L.x < -200) { G.level++; G.lob = makeLobster(G.level); }
  for (const p of L.parts) { p.shake = Math.max(0, p.shake - dt); p.flash = Math.max(0, p.flash - dt); }

  // steam off the fresh lobster
  if (!L.done && Math.random() < dt * 7) G.fx.push({ type: 'steam', x: L.x + rand(-45, 45), y: L.y + rand(-80, 120), vx: rand(-8, 8), vy: rand(-40, -25), life: 1.8, max: 1.8, size: rand(6, 12) });
  if (Math.random() < dt * 2) G.fx.push({ type: 'steam', x: BUTTER.x + rand(-12, 12), y: BUTTER.y - 10, vx: rand(-5, 5), vy: -22, life: 1.4, max: 1.4, size: rand(4, 7) });

  // meats
  for (const m of G.meats) {
    if (m.state === 'fly') {
      m.t += dt; const u = Math.min(1, m.t / m.dur);
      m.x = lerp(m.x0, m.x1, u); m.y = lerp(m.y0, m.y1, u) - Math.sin(Math.PI * u) * 70;
      if (u >= 1) { m.state = 'rest'; m.age = 0; sfx.plop(); showHint('eat'); }
    } else if (m.state === 'rest') m.age += dt;
    else if (m.state === 'eat') {
      m.t += dt;
      if (m.t < 0.2) { const u = m.t / 0.2; m.x = lerp(m.ex, BUTTER.x, u); m.y = lerp(m.ey, BUTTER.y, u) - Math.sin(Math.PI * u) * 40; }
      else {
        if (!m.dipped) { m.dipped = true; for (let i = 0; i < 5; i++) G.fx.push({ type: 'drop', x: BUTTER.x, y: BUTTER.y, vx: rand(-70, 70), vy: rand(-160, -60), life: 0.6, max: 0.6, size: rand(2, 4) }); }
        const u = Math.min(1, (m.t - 0.2) / 0.35); m.x = lerp(BUTTER.x, W / 2, u); m.y = lerp(BUTTER.y, -40, u);
        if (u >= 1) m.dead = true;
      }
    }
  }

  // gulls
  if (G.mode === 'play' && G.started) {
    let hunting = G.gulls.filter(g => g.state === 'approach' || g.state === 'dive').length;
    const maxG = Math.min(3, 1 + Math.floor(G.level / 2));
    const delay = Math.max(1.2, 2.6 - G.level * 0.15);
    for (const m of G.meats) {
      if (hunting >= maxG) break;
      if (m.state === 'rest' && !m.gull && m.age > delay) { spawnGull(m, false); hunting++; }
    }
  }
  if (G.mode === 'play') {
    G.patrolT -= dt;
    if (G.patrolT <= 0) { G.patrolT = rand(6, 10); if (G.gulls.length < 2) spawnGull(null, true); }
  }
  const sp = 1 + G.level * 0.07;
  for (const g of G.gulls) {
    g.flap += dt * (g.state === 'dive' ? 9 : 14);
    if (g.state === 'approach') {
      if (!g.m || g.m.state !== 'rest') { g.state = 'leave'; g.vx = g.face * 200; g.vy = -200; if (g.m) g.m.gull = null; g.m = null; continue; }
      if (moveToward(g, g.m.x, g.m.y - 100, 230 * sp, dt)) g.state = 'dive';
    } else if (g.state === 'dive') {
      if (!g.m || g.m.state !== 'rest') { g.state = 'leave'; g.vx = g.face * 200; g.vy = -200; g.m = null; continue; }
      if (moveToward(g, g.m.x, g.m.y - 6, 300 * sp, dt)) {
        const m = g.m; m.state = 'stolen'; g.carry = m; g.m = null; g.state = 'leave';
        g.vx = g.face * 190; g.vy = -240;
        if (G.mode === 'play') { G.time = Math.max(0.01, G.time - 2); G.stolen++; G.combo = 0; }
        pop(m.x, m.y - 30, pick(['GULL GOT IT!', 'HEY! THIEF!', 'MY LOBSTER!']), '#ff7a6b', 22, 1.1);
        pop(m.x, m.y - 4, '-2s', '#ff7a6b', 18, 1.1);
        sfx.caw(); sfx.bad(); feathers(m.x, m.y);
      }
    } else {
      if (g.state === 'patrol') { g.x += g.vx * dt; g.y = g.base + Math.sin(T * 3 + g.flap * 0.1) * 18; }
      else { g.x += g.vx * dt; g.y += g.vy * dt; g.vy -= 60 * dt; }
      if (g.carry) { g.carry.x = g.x; g.carry.y = g.y + 18; }
      if (g.x < -140 || g.x > W + 140 || g.y < -160) { g.dead = true; if (g.carry) g.carry.dead = true; }
    }
  }
  G.gulls = G.gulls.filter(g => !g.dead);
  G.meats = G.meats.filter(m => !m.dead);

  for (const f of G.fx) {
    f.life -= dt;

const RED = '#d8432a', RED_HI = '#f26a45', RED_DK = '#8e2414';

}

  ctx.save(); ctx.translate(L.x, L.y);

  ctx.fillStyle = 'rgba(80,40,20,.12)'; ctx.beginPath(); ctx.ellipse(6, 20, 70, 170, 0, 0, 7); ctx.fill();

  ctx.strokeStyle = '#b8321f'; ctx.lineWidth = 2.4;

    ctx.beginPath(); ctx.moveTo(8 * s, -74); ctx.quadraticCurveTo(28 * s, -240, (150 + Math.sin(T * 2 + s) * 6) * s, -250); ctx.stroke();

  ctx.fillStyle = g; ctx.strokeStyle = RED_DK; ctx.lineWidth = 2;

  ctx.beginPath(); ctx.moveTo(-7, -74); ctx.lineTo(0, -98); ctx.lineTo(7, -74); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(100,20,10,.5)'; ctx.beginPath(); ctx.moveTo(-30, -30); ctx.quadraticCurveTo(0, -10, 30, -30); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.ellipse(-14, -40, 9, 22, 0.2, 0, 7); ctx.fill();

    ctx.strokeStyle = '#e45b3f'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(0, 0, m.w * 0.92, m.h * 0.85, 0, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(0, 0, m.w, m.h, 0, 0, 7); ctx.fill(); ctx.stroke();
    if (m.type === 'claw') { ctx.beginPath(); ctx.ellipse(m.w * 0.5, -m.h * 0.8, m.w * 0.35, m.h * 0.6, 0.5, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(228,91,63,.85)'; ctx.lineWidth = Math.max(2, m.h * 0.35);
    ctx.beginPath(); ctx.ellipse(0, 0, m.w * 0.8, m.h * 0.7, 0, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
  if (m.dipped) { ctx.fillStyle = 'rgba(247,207,61,.55)'; ctx.beginPath(); ctx.ellipse(0, m.h * 0.3, m.w * 0.8, m.h * 0.5, 0, 0, 7); ctx.fill(); }
  ctx.restore();
}

function drawTool(t) {
  const u = t.t / 0.25;
  ctx.save(); ctx.translate(t.x, t.y); ctx.globalAlpha = 1 - u * u;
  if (t.kind === 'cracker') {
    const spread = 0.42 - Math.min(1, u * 3) * 0.32;
    ctx.rotate(-0.6);
    for (const s of [-1, 1]) {
      ctx.save(); ctx.translate(0, 64); ctx.rotate(spread * s);
      ctx.strokeStyle = '#d7dde2'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -62); ctx.stroke();
      ctx.strokeStyle = '#8c969e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-1.5, -10); ctx.lineTo(-1.5, -58); ctx.stroke();
      ctx.strokeStyle = '#b8321f'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(0, 6); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#9aa4ab'; ctx.beginPath(); ctx.arc(0, 64, 6, 0, 7); ctx.fill();
  } else {
    const jab = Math.sin(Math.min(1, u * 2) * Math.PI) * 10;
    ctx.rotate(-0.75); ctx.translate(0, 8 - jab);
    ctx.strokeStyle = '#e3e8ec'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, 70); ctx.stroke();
    ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-3, 6); ctx.lineTo(-3, -4); ctx.moveTo(3, 6); ctx.lineTo(3, -4); ctx.stroke();
    ctx.fillStyle = '#1f2f4a'; rr(-4.5, 46, 9, 30, 4); ctx.fill();
  }
  ctx.restore();
}

function drawFX(f) {
  const a = Math.max(0, f.life / f.max);
  if (f.type === 'shard') { ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.globalAlpha = a; ctx.fillStyle = f.color; ctx.beginPath(); ctx.moveTo(-f.size, -f.size * 0.6); ctx.lineTo(f.size, 0); ctx.lineTo(-f.size * 0.4, f.size * 0.8); ctx.closePath(); ctx.fill(); ctx.restore(); }
  else if (f.type === 'feather') { ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.globalAlpha = a; ctx.fillStyle = '#f4f6f7'; ctx.strokeStyle = '#a9b4ba'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(0, 0, f.size * 1.6, f.size * 0.6, 0, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore(); }
  else if (f.type === 'steam') { ctx.globalAlpha = a * 0.28; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(f.x, f.y, f.size * (1.8 - a), 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  else if (f.type === 'drop') { ctx.globalAlpha = a; ctx.fillStyle = '#f7cf3d'; ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  else if (f.type === 'ring') { ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, 8 + (1 - a) * 18, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
}

function drawGull(g) {
  if (g.state === 'approach' || g.state === 'dive') {
    const b = Math.sin(T * 14) > 0;
    ctx.fillStyle = b ? '#ff4b3a' : '#ffd34d';
    ctx.beginPath(); ctx.arc(g.x, g.y - 36, 11, 0, 7); ctx.fill();
    text('!', g.x, g.y - 35, 16, '#fff', 'center', null);
  }
  drawGullShape(g.x, g.y, g.face, g.flap, 1.15);
}

const HINTS = {
  crack: 'TAP THE SHELL TO CRACK IT!',
  eat: 'TAP THE MEAT TO EAT IT!',
  stuck: 'MEAT STUCK! KEEP TAPPING TO PICK IT OUT',
  gull: 'GULL INCOMING! TAP IT TO SHOO!'
};
function hintTarget() {
  const L = G.lob;
  if (G.hint === 'crack') { const p = L.parts.find(q => q.type === 'claw' && q.side > 0); const [x, y] = partWorld(p); return [x, y + 10]; }
  if (G.hint === 'eat') { const m = G.meats.find(q => q.state === 'rest'); return m ? [m.x, m.y] : null; }
  if (G.hint === 'stuck') { const p = L.parts.find(q => q.state === 'stuck'); return p ? partWorld(p) : null; }
  if (G.hint === 'gull') { const g = G.gulls.find(q => q.state === 'approach' || q.state === 'dive'); return g ? [g.x, g.y] : null; }
  return null;
}
function drawHint() {
  if (!G.hint || G.mode !== 'play') return;
  const tgt = hintTarget();
  if (!tgt) { if (G.hint !== 'crack') G.hint = null; return; }
  const s = 1 + Math.sin(T * 6) * 0.04;
  ctx.save(); ctx.translate(W / 2, 128); ctx.scale(s, s);
  ctx.font = `17px ${FONT}`; const w = Math.min(W - 16, ctx.measureText(HINTS[G.hint]).width + 34);
  ctx.fillStyle = G.hint === 'gull' ? 'rgba(170,30,20,.92)' : 'rgba(18,40,64,.92)';
  rr(-w / 2, -20, w, 40, 20); ctx.fill();
  ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.restore();
  text(HINTS[G.hint], W / 2, 128, G.hint === 'stuck' ? 14 : 17, '#fff', 'center', null);
  const bob = Math.abs(Math.sin(T * 7)) * 14;
  ctx.font = '46px system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('👆', tgt[0] + 6, tgt[1] + 14 + bob);
}

function drawHUD(vx0, vx1, vy0) {
  const g = ctx.createLinearGradient(0, vy0, 0, 92);
  g.addColorStop(0, 'rgba(14,32,52,.95)'); g.addColorStop(1, 'rgba(14,32,52,.75)');
  ctx.fillStyle = g; ctx.fillRect(vx0, vy0, vx1 - vx0, 92 - vy0);
  text('SHELL SHOCKED', 14, 22, 18, '#ffe066', 'left', 'rgba(0,0,0,.6)', 3);
  text('HARBOURFRONT LOBSTER RUSH', 16, 42, 9, 'rgba(255,255,255,.7)', 'left', null);
  text(G.score.toLocaleString(), W - 50, 24, 24, '#fff', 'right', 'rgba(0,0,0,.6)', 3);
  text('🦞 ' + G.cleared + (best ? '   BEST ' + best.toLocaleString() : ''), W - 50, 44, 11, 'rgba(255,255,255,.8)', 'right', null);
  // mute
  text(muted ? '🔇' : '🔊', W - 24, 22, 20, '#fff', 'center', null);
  // time bar
  const bx = 14, by = 58, bw = W - 28, bh = 22, frac = clamp(G.time / 40, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,.15)'; rr(bx, by, bw, bh, 11); ctx.fill();
  const low = G.time < 10 && G.started;
  ctx.fillStyle = low ? (Math.sin(T * 14) > 0 ? '#ff4b3a' : '#ff9a3a') : (G.time < 20 ? '#ffb13a' : '#3ccf8e');
  if (frac > 0.02) { rr(bx, by, Math.max(22, bw * frac), bh, 11); ctx.fill(); }
  const label = G.started ? Math.ceil(G.time) + 's  ·  CRACK IT, EAT IT, DON\'T FEED THE GULLS' : 'CLOCK STARTS ON YOUR FIRST TAP';
  text(label, W / 2, by + bh / 2 + 1, 10.5, '#fff', 'center', 'rgba(0,0,0,.5)', 3);
}

function drawOver(vx0, vx1, vy0, vy1) {
  const a = Math.min(1, G.overT * 3);
  ctx.fillStyle = `rgba(8,20,34,${0.7 * a})`; ctx.fillRect(vx0, vy0, vx1 - vx0, vy1 - vy0);
  const y0 = 230 + (1 - a) * 40;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#fbf6ea'; rr(40, y0, W - 80, 320, 22); ctx.fill();
  ctx.strokeStyle = '#d8432a'; ctx.lineWidth = 5; ctx.stroke();
  text("TIME'S UP!", W / 2, y0 + 44, 34, '#d8432a', 'center', null);
  text('You cleared', W / 2, y0 + 88, 15, '#5b4a3a', 'center', null);
  text(G.cleared + (G.cleared === 1 ? ' LOBSTER' : ' LOBSTERS'), W / 2, y0 + 118, 30, '#1f2f4a', 'center', null);
  text('SCORE ' + G.score.toLocaleString(), W / 2, y0 + 160, 22, '#1f2f4a', 'center', null);
  text(G.newBest ? '★ NEW PERSONAL BEST ★' : 'BEST ' + best.toLocaleString(), W / 2, y0 + 190, 14, G.newBest ? '#c98a00' : '#7a6a5a', 'center', null);
  text(G.bites + ' bites eaten · ' + G.stolen + ' stolen by gulls', W / 2, y0 + 222, 12, '#7a6a5a', 'center', null);
  if (G.overT > 0.9) {
    const s = 1 + Math.sin(T * 6) * 0.05;
    ctx.save(); ctx.translate(W / 2, y0 + 272); ctx.scale(s, s);
    ctx.fillStyle = '#d8432a'; rr(-110, -24, 220, 48, 24); ctx.fill();
    ctx.restore();
    text('TAP TO GO AGAIN', W / 2, y0 + 273, 18, '#fff', 'center', null);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#16384d'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sx = G.shake > 0 ? rand(-1, 1) * G.shake * 28 : 0, sy = G.shake > 0 ? rand(-1, 1) * G.shake * 28 : 0;
  const vx0 = -ox / sc, vx1 = (cw - ox) / sc, vy0 = -oy / sc, vy1 = (ch - oy) / sc;
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
  drawBG(vx0, vx1, vy0, vy1);
  ctx.save(); ctx.translate(sx, sy);
  drawTable();
  drawLobster(G.lob);
  for (const m of G.meats) if (m.state === 'rest' || m.state === 'fly') drawMeat(m);
  for (const f of G.fx) drawFX(f);
  for (const m of G.meats) if (m.state === 'eat' || m.state === 'stolen') drawMeat(m);
  for (const g of G.gulls) drawGull(g);
  for (const t of G.tools) drawTool(t);
  ctx.restore();
  for (const s of G.splats) {
    const a = Math.min(1, s.life / s.max * 1.6);
    for (const b of s.blobs) {
      ctx.fillStyle = `rgba(238,228,190,${0.6 * a})`; ctx.beginPath(); ctx.arc(s.x + b.dx, s.y + b.dy + (1 - a) * 20, b.r, 0, 7); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${0.5 * a})`; ctx.beginPath(); ctx.arc(s.x + b.dx - b.r * 0.3, s.y + b.dy - b.r * 0.3 + (1 - a) * 20, b.r * 0.25, 0, 7); ctx.fill();
    }
  }
  for (const p of G.pops) {
    const u = p.t / p.dur, s = u < 0.15 ? 0.6 + u / 0.15 * 0.5 : 1.1 - Math.min(0.1, (u - 0.15));
    ctx.globalAlpha = u > 0.7 ? 1 - (u - 0.7) / 0.3 : 1;
    text(p.text, p.x, p.y - u * 34, p.size * s, p.color, 'center', 'rgba(0,0,0,.65)', 4);
    ctx.globalAlpha = 1;
  }
  drawHint();
  drawHUD(vx0, vx1, vy0);
  text('crack · pick · eat · shoo the gulls', W / 2, Math.min(vy1 - 12, 748), 11, 'rgba(255,235,210,.65)', 'center', null);
  if (G.mode === 'over') drawOver(vx0, vx1, vy0, vy1);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; T += dt;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__G = () => G; window.__tap = tap;
})();
</script>
</body>
</html>
