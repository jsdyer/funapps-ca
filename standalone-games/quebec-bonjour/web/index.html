<!doctype html>
<html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonjour, voisin! — Your Table in Québec | FunApps</title><meta name="description" content="You’re an English-speaking visitor at a Québec restaurant. Choose a French phrase for the food you want, watch your order arrive, and pick up six useful phrases. English help is always available."><meta name="theme-color" content="#28285b"><link rel="stylesheet" href="./cafe.css"><script defer src="./game.js"></script><link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="icon" href="favicon.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
</head>
<body x-data="cafe"><noscript><p>This game needs JavaScript. <a href="https://funapps.ca/">Return to FunApps</a>.</p></noscript>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="food-bread" viewBox="0 0 100 80"><ellipse cx="50" cy="69" rx="40" ry="6" fill="#2c2350" opacity=".13"/><path d="M12 49C12 9 87 6 90 45L86 62Q50 77 15 62Z" fill="#e8a54b"/><path d="M14 48Q51 62 89 45L86 62Q48 76 15 62Z" fill="#bb7136"/><path d="M33 28 27 44M52 23 45 42M72 24 64 41" stroke="#fff0b4" stroke-width="8" stroke-linecap="round"/></symbol>
<symbol id="food-coffee" viewBox="0 0 100 80"><ellipse cx="48" cy="70" rx="40" ry="6" fill="#2c2350" opacity=".13"/><path d="M73 27H83C104 29 94 56 73 55" fill="none" stroke="#d8ccef" stroke-width="9"/><path d="M19 24H76L70 61Q48 78 25 61Z" fill="#f6edff"/><ellipse cx="48" cy="25" rx="28" ry="9" fill="#694451"/><path d="M32 5Q23 14 34 18M49 1Q40 10 51 15M65 3Q58 10 65 15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></symbol>
<symbol id="food-apple" viewBox="0 0 100 80"><ellipse cx="50" cy="71" rx="35" ry="5" fill="#2c2350" opacity=".13"/><path d="M51 24C17 1 5 47 27 69Q40 80 51 72Q65 80 79 61C99 27 79 7 51 24" fill="#ef6865"/><path d="M50 26Q42 14 49 6" stroke="#64494d" stroke-width="6" fill="none"/><path d="M51 16Q59-2 77 7Q72 24 51 16" fill="#78b66a"/><path d="M28 31Q18 42 25 51" stroke="#ffbf9c" stroke-width="7" stroke-linecap="round" fill="none"/></symbol>

<symbol id="food-water" viewBox="0 0 100 80"><ellipse cx="50" cy="72" rx="30" ry="5" fill="#2c2350" opacity=".13"/><path d="M23 12H77L70 67Q50 77 30 67Z" fill="#effaff" stroke="#75bad0" stroke-width="4"/><path d="M29 34Q50 41 72 34L68 64Q50 72 33 64Z" fill="#77cadb"/><path d="M34 18 39 58" stroke="#fff" stroke-width="5" stroke-linecap="round"/><ellipse cx="50" cy="12" rx="27" ry="7" fill="#dff3f3" stroke="#75bad0" stroke-width="3"/></symbol>
<symbol id="food-soup" viewBox="0 0 100 80"><ellipse cx="50" cy="69" rx="44" ry="7" fill="#f9f3e8" stroke="#c3b7cf" stroke-width="2"/><path d="M10 31H90Q87 69 50 70Q13 69 10 31" fill="#edb58b"/><ellipse cx="50" cy="31" rx="40" ry="13" fill="#d8733d" stroke="#ffe1ab" stroke-width="5"/><g fill="#7d9f4a"><ellipse cx="39" cy="29" rx="7" ry="3"/><ellipse cx="62" cy="35" rx="6" ry="3"/></g><path d="M36 7q-7 7 2 12M57 2q-7 7 2 12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></symbol>
<symbol id="food-cake" viewBox="0 0 100 80"><ellipse cx="50" cy="70" rx="45" ry="7" fill="#f7f2e9" stroke="#c7b6d3" stroke-width="2"/><path d="M15 30 65 14 88 29V64L15 69Z" fill="#b17b55"/><path d="M15 39 88 33V43L15 49M15 56 88 50V58L15 64" fill="#fff0ca"/><path d="M15 30 65 14 88 29 15 39Z" fill="#f7d9c1"/><path d="M58 13q-3-16 9-12" fill="none" stroke="#6d9452" stroke-width="3"/><circle cx="59" cy="14" r="9" fill="#db5a61"/></symbol>
<symbol id="food-bill" viewBox="0 0 100 80"><rect x="20" y="5" width="60" height="67" rx="5" fill="#5f4b71"/><path d="M28 1H72V69L65 64 59 69 53 64 47 69 41 64 35 69 28 64Z" fill="#fff8e3"/><path d="M37 14H63M37 23H63M37 32H54M37 42H63M48 53H63" fill="none" stroke="#bba8bc" stroke-width="4"/><path d="M35 55h8" stroke="#6c9866" stroke-width="4"/></symbol>
</defs></svg>
<div class="restaurant-game" x-cloak :class="{'demo':state.status==='ready','paused':state.status==='paused'}">
<header class="game-header"><a href="https://funapps.ca/" class="brand">f<span>.</span></a><div><p>AN ANGLOPHONE AT A QUÉBEC TABLE</p><h1>Bonjour, voisin!</h1></div><a href="./classic.html" class="village-link">Village adventure</a><button class="pause-button" @click="pause()" :disabled="!['playing','paused'].includes(state.status)" x-text="state.status==='paused'?'Resume':'Pause'"></button></header>
<main>
<div class="visit-bar"><span><b x-text="state.ordered.length"></b> / 6 requests</span><div class="progress-dots" aria-hidden="true"><template x-for="(_,i) in requests" :key="i"><i :class="{'done':i<state.ordered.length,'current':i===state.step}"></i></template></div><strong x-text="state.status==='ready'?'Your table is ready.':request.chapter"></strong></div>
<section class="restaurant" aria-label="Your table in a Québec restaurant">
<div class="window"><span class="sun"></span><span class="cloud c1"></span><span class="cloud c2"></span><div class="skyline"><i></i><i></i><i></i><i></i><i></i></div><div class="river"></div></div>
<div class="awning"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="shop-sign">LE PETIT RESTO</div>
<div class="server-area"><div class="speech" :class="{'success':state.correct}"><span class="server-name">ÉLISE · YOUR SERVER</span><p lang="fr" x-text="state.reply"></p><small x-text="state.replyEnglish"></small></div><div class="server"><div class="hair"></div><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="smile"></i></div><div class="shirt"></div><div class="apron"></div><span class="arm"></span><span class="tray"></span></div></div>
<div class="your-wish" x-show="state.status!=='finished'"><span>YOU’D LIKE</span><svg viewBox="0 0 100 80" aria-hidden="true"><use :href="'#food-'+wanted.id"></use></svg><strong x-text="wanted.en"></strong><small>What do you say?</small></div>
<div class="table"><div class="placemat"><span class="fork">♜</span><div class="plate"><template x-if="state.shownItem"><svg class="delivered-food" :class="{'mistake':!state.correct}" viewBox="0 0 100 80" :aria-label="menu[state.shownItem].en+' on the table'"><use :href="'#food-'+state.shownItem"></use></svg></template></div><span class="knife"></span></div><div class="table-label">YOUR TABLE · TABLE POUR UNE PERSONNE</div><div class="vase">✿</div></div>
<div class="play-card" x-show="state.status!=='playing'" x-transition.opacity>
<template x-if="state.status==='ready'"><div><p class="eyebrow">YOU’RE THE CUSTOMER</p><h2>A little French.<br>A good lunch.</h2><p>Pick a phrase. Order what you fancy.</p><button class="play" @click="begin()">Take a seat</button><small>English help is always here. No timer.</small></div></template>
<template x-if="state.status==='paused'"><div><p class="eyebrow">TAKE YOUR TIME</p><h2>A little pause.</h2><button class="play" @click="pause()">Back to the table</button><button class="text-button" @click="begin()">Start a new visit</button></div></template>
<template x-if="state.status==='finished'"><div><p class="eyebrow">YOU DID THE ORDERING</p><h2>Bon appétit,<br>neighbour!</h2><p>Six requests. A whole meal in French.</p><div class="result"><strong x-text="state.score"></strong><span>points · English help is always free</span></div><button class="play" @click="begin()">Visit again</button><button class="text-button" @click="phrasebook=!phrasebook" x-text="phrasebook?'Close your phrases':'Keep these six phrases'"></button></div></template>
</div>
</section>
<div class="choice-heading"><div><strong x-text="state.delivery>0?'Your order is arriving…':'SAY IT IN FRENCH'"></strong><p role="status" aria-live="polite" x-text="state.feedback"></p></div><button class="help-toggle" @click="english=!english" :aria-pressed="helpVisible" :disabled="state.step<2" x-text="state.step<2?'English hints on':english?'English help: on':'English help'"></button></div>
<section class="phrase-tray" aria-label="Choose your French order"><template x-for="(option,index) in options" :key="state.step+'-'+option.id"><button class="phrase-button" @click="choose(index)" :disabled="['paused','finished'].includes(state.status)||state.delivery>0" :aria-label="option.fr+(helpVisible?' — '+option.en:'')+' (key '+(index+1)+')'"><kbd x-text="index+1"></kbd><strong lang="fr" x-text="option.fr"></strong><small x-show="helpVisible" x-text="option.en"></small></button></template></section>
<section class="phrasebook" x-show="phrasebook&&state.status==='finished'" aria-label="Your restaurant phrases"><h2>A few words to take with you.</h2><template x-for="phrase in learning" :key="phrase.id"><div><svg viewBox="0 0 100 80" aria-hidden="true"><use :href="'#food-'+phrase.id"></use></svg><p><strong lang="fr" x-text="phrase.fr"></strong><span x-text="phrase.en"></span></p></div></template></section>
</main><footer><span>A Maritime visitor. A Québec welcome.</span><span>Choose with 1 · 2 · 3 · P to pause</span></footer>
</div></body></html>
