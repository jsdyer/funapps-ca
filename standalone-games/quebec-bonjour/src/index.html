<!doctype html>
<html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonjour, voisin! — Café Rush | FunApps</title><meta name="description" content="Orders are arriving at a little Québec café. Match the pictures and serve bread, coffee and apples in a cheerful one-minute shift. No French needed."><meta name="theme-color" content="#28285b"><link rel="stylesheet" href="./cafe.css"><script defer src="./game.js"></script></head>
<body x-data="cafe"><noscript><p>This game needs JavaScript. <a href="https://funapps.ca/">Return to FunApps</a>.</p></noscript>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="food-bread" viewBox="0 0 100 80"><ellipse cx="50" cy="69" rx="40" ry="6" fill="#2c2350" opacity=".13"/><path d="M12 49C12 9 87 6 90 45L86 62Q50 77 15 62Z" fill="#e8a54b"/><path d="M14 48Q51 62 89 45L86 62Q48 76 15 62Z" fill="#bb7136"/><path d="M33 28 27 44M52 23 45 42M72 24 64 41" stroke="#fff0b4" stroke-width="8" stroke-linecap="round"/></symbol>
<symbol id="food-coffee" viewBox="0 0 100 80"><ellipse cx="48" cy="70" rx="40" ry="6" fill="#2c2350" opacity=".13"/><path d="M73 27H83C104 29 94 56 73 55" fill="none" stroke="#d8ccef" stroke-width="9"/><path d="M19 24H76L70 61Q48 78 25 61Z" fill="#f6edff"/><ellipse cx="48" cy="25" rx="28" ry="9" fill="#694451"/><path d="M32 5Q23 14 34 18M49 1Q40 10 51 15M65 3Q58 10 65 15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></symbol>
<symbol id="food-apple" viewBox="0 0 100 80"><ellipse cx="50" cy="71" rx="35" ry="5" fill="#2c2350" opacity=".13"/><path d="M51 24C17 1 5 47 27 69Q40 80 51 72Q65 80 79 61C99 27 79 7 51 24" fill="#ef6865"/><path d="M50 26Q42 14 49 6" stroke="#64494d" stroke-width="6" fill="none"/><path d="M51 16Q59-2 77 7Q72 24 51 16" fill="#78b66a"/><path d="M28 31Q18 42 25 51" stroke="#ffbf9c" stroke-width="7" stroke-linecap="round" fill="none"/></symbol>
</defs></svg>
<div class="cafe-game" x-cloak :class="{'demo':state.status==='ready','paused':state.status==='paused'}">
<header class="game-header"><a href="https://funapps.ca/" class="brand">f<span>.</span></a><div><p>QUÉBEC · A MARITIMER AT THE COUNTER</p><h1>Bonjour, voisin!</h1></div><a href="./classic.html" class="village-link">Village adventure</a><button class="pause-button" @click="pause()" :disabled="!['playing','paused'].includes(state.status)" :aria-label="state.status==='paused'?'Resume café':'Pause café'" x-text="state.status==='paused'?'Resume':'Pause'"></button></header>
<main>
<section class="scoreboard" aria-label="Shift score"><div><span>TIME</span><strong x-text="time+'s'"></strong></div><div class="score"><span>SERVED</span><strong x-text="state.served"></strong></div><div><span>POINTS</span><strong x-text="state.score"></strong></div><div class="best"><span>BEST</span><strong x-text="best"></strong></div></section>
<section class="shop" aria-label="Café customers and orders">
<div class="window"><span class="sun"></span><span class="cloud c1"></span><span class="cloud c2"></span><div class="skyline"><i></i><i></i><i></i><i></i><i></i></div><div class="river"></div></div>
<div class="awning"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="shop-sign">LE PETIT CAFÉ <span>☕</span></div>
<div class="customers" :aria-hidden="state.status==='ready'?'true':null">
<template x-for="customer in state.customers" :key="customer.id"><div class="customer" :style="'--lane:'+customer.lane+';--shirt:'+['#7062b8','#e98665','#3c948c','#d4a044'][customer.id%4]+';--skin:'+['#d99874','#edbb98','#9c604d','#d6a082'][customer.id%4]+';--delay:'+(customer.lane*.6)+'s'">
<div class="order-bubble" :aria-label="'Order: '+food(customer.food).en"><svg viewBox="0 0 100 80" aria-hidden="true"><use :href="'#food-'+customer.food"></use></svg><strong x-text="food(customer.food).en"></strong><div class="patience" aria-hidden="true"><span :style="'transform:scaleX('+Math.max(0,customer.patience/customer.maxPatience)+')'"></span></div></div>
<div class="person"><div class="hair"></div><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="smile"></i></div><div class="shirt"></div><span class="arm"></span></div>
</div></template>
</div>
<div class="counter"><div class="counter-edge"></div><div class="register">BONJOUR! <span>✦</span></div><div class="flower">✿</div></div>
<div class="play-card" x-show="state.status!=='playing'" x-transition.opacity>
<template x-if="state.status==='ready'"><div><p class="eyebrow">CAFÉ RUSH · 60 SECONDS</p><h2>A café full<br>of bonjours.</h2><p>Match the picture. Tap the food.</p><button class="play" @click="begin()">Open the café</button><small>Or tap a food below · keys 1, 2, 3</small></div></template>
<template x-if="state.status==='paused'"><div><p class="eyebrow">THE KETTLE CAN WAIT</p><h2>Taking a break.</h2><button class="play" @click="pause()">Keep serving</button><button class="text-button" @click="begin()">Start a new shift</button></div></template>
<template x-if="state.status==='finished'"><div><p class="eyebrow">SHIFT COMPLETE</p><h2>Merci, neighbour!</h2><div class="result"><strong x-text="state.score"></strong><span>points · <b x-text="state.served"></b> happy neighbours</span></div><button class="play" @click="begin()">Another quick shift</button></div></template>
</div>
</section>
<div class="feedback-bar"><p role="status" aria-live="polite" x-text="state.feedback"></p><span x-show="state.combo>1" x-text="'✦ '+state.combo+' in a row'"></span></div>
<section class="food-tray" aria-label="Serve an order"><template x-for="(item,index) in foods" :key="item.id"><button class="food-button" @click="serve(item.id)" :disabled="['paused','finished'].includes(state.status)" :aria-label="'Serve '+item.en+' (key '+(index+1)+')'"><kbd x-text="index+1"></kbd><svg viewBox="0 0 100 80" aria-hidden="true"><use :href="'#food-'+item.id"></use></svg><span><strong x-text="item.en"></strong><small lang="fr" x-text="item.fr"></small></span></button></template></section>
</main><footer><span>A little Québec hospitality. No French needed.</span><span>Tap or use 1 · 2 · 3 · P to pause</span></footer>
</div></body></html>
