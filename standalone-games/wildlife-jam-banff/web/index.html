<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wildlife Jam! A Maritimer Drives Banff — FunApps</title>
<meta name="description" content="A Nova Scotian in a rusty hatchback takes on a Rocky Mountain wildlife jam. Dodge brake-slammers, people wandering out of their cars, elk, bears and bighorn sheep.">
<meta name="theme-color" content="#4f7a48">

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2f4a36;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#55704f,#2f4a36)}
  canvas{display:block;box-shadow:0 0 40px rgba(0,0,0,.35);touch-action:none}
  #ui{position:fixed;top:8px;right:8px;display:flex;gap:6px;z-index:2}
  #ui button,#ui a{font:600 14px system-ui;background:rgba(255,255,255,.85);color:#1e3550;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;text-decoration:none}
</style>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="icon" href="favicon.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
</head>
<body>
<div id="wrap"><canvas id="c" aria-label="Driving game: steer and brake to get through a wildlife traffic jam"></canvas></div>
<div id="ui"><button id="pause" aria-label="Pause">⏸</button><button id="mute" aria-label="Sound">🔊</button><a href="https://funapps.ca/">More games</a></div>
<script>
(() => {
"use strict";
const W = 480, H = 800;
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let scale = 1; const dpr = Math.min(window.devicePixelRatio || 1, 2);
function fit(){
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W*scale)+'px'; cv.style.height = (H*scale)+'px';
  cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', fit); fit();

const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let best = +store.get('jam-best') || 0;
let muted = store.get('jam-muted') === '1';

// ---------- audio ----------
let ac = null;
function beep(freq, dur, type='square', vol=.06, slide=0){
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(20,freq+slide), ac.currentTime+dur);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
  } catch(e){}
}
const sfx = {
  honk(){ beep(392,.18,'square',.05); beep(494,.18,'square',.04); },
  crash(){ beep(140,.4,'sawtooth',.09,-100); setTimeout(()=>beep(90,.2,'square',.05),80); },
  snap(){ beep(1800,.04,'square',.05); setTimeout(()=>beep(1200,.06,'square',.04),40); },
  bit(){ beep(880,.07,'square',.05); setTimeout(()=>beep(1320,.07,'square',.04),55); },
  coffee(){ [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.1,'triangle',.07),i*60)); },
  screech(){ beep(1400,.25,'sawtooth',.025,-500); },
  over(){ [440,370,311,262].forEach((f,i)=>setTimeout(()=>beep(f,.22,'triangle',.08),i*160)); }
};

// ---------- our Maritimer ----------
const LINES = {
  start: ["Some traffic for the middle of nowhere!","Rental's out of the question, we're takin' the Corolla.","Halifax to here and THIS is the hold-up?"],
  brake: ["Oh my dear, they're stoppin'!","Nobody brakes like that on the 102!","Brake lights! BRAKE LIGHTS!","What are they lookin' at?"],
  person: ["Get back in your car, buddy!","Sir. SIR. That is a road.","Selfie with an elk? Some brave."],
  elk: ["That's no moose!","Smaller than a Cape Breton moose, mind.","Elk! Everybody stop! Apparently."],
  bear: ["Is that a BEAR? IS THAT A BEAR?","Windows up, b'ys!","Don't get out for the bear, don't get out for the bear…"],
  sheep: ["Sheep lickin' road salt? Down home the salt's for the fries.","Mountain sheep! Nice horns, bud."],
  crash: ["Some dent!","There goes the deposit.","Lard tunderin'!","That'll be a call to the insurance.","Holy dyin'!"],
  animalhit: ["Sorry, sorry! It's fine, it trotted off.","It's okay! Just startled 'im."],
  coffee: ["Double-double! Now we're drivin'.","Coffee! I can see clearly now."],
  shot: ["Got 'er! Postcard material.","Wait till Nan sees this one.","Some shot!"],
  oncoming: ["Wrong lane, wrong lane!","Yikes, that was close!"],
  over: ["Pull over, I need a donair.","We'll take the bus next time.","Tow truck's on the way. Again?"]
};
const pick = a => a[Math.random()*a.length|0];
let bubble = null;
function say(kind, force){ if (!force && bubble && bubble.t > 0.8) return; bubble = { text: pick(LINES[kind]), t: 2.3 }; }

// ---------- layout ----------
// All game logic runs in "road space" (a straight road centred on MID).
// The road winds on screen; offAt(y) shifts drawing sideways for each row.
const MID = 240, ROAD_HALF = 98, ASPHALT_HALF = 82;
const ROAD_L = MID - ROAD_HALF, ROAD_R = MID + ROAD_HALF;
const LANE_OPP = MID - 41, LANE_MINE = MID + 41;  // centre of lanes
const SH_L = MID - 104, SH_R = MID + 104;         // cars pulled half onto the gravel
function offAt(y){ const w = scroll - y; return 52*Math.sin(w/520) + 20*Math.sin(w/1300 + 1); }
const BRAKE_BTN = { x: W-112, y: H-112, w: 100, h: 100 };

// ---------- input ----------
const keys = {}; const pointers = new Map();
let usedInput = false;
function toWorld(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left)/scale, y: (e.clientY - r.top)/scale }; }
function inBrake(p){ return p.x > BRAKE_BTN.x - 10 && p.y > BRAKE_BTN.y - 10; }
cv.addEventListener('pointerdown', e => {
  const p = toWorld(e); usedInput = true;
  if (state === 'over') { tapAction(); return; }
  if (paused) { tapAction(); return; }
  pointers.set(e.pointerId, { x: p.x, brake: inBrake(p), mouse: e.pointerType==='mouse' });
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
});
cv.addEventListener('pointermove', e => {
  const p = toWorld(e);
  if (e.pointerType === 'mouse' && !pointers.has(e.pointerId)) { mouseX = p.x; return; }
  const pt = pointers.get(e.pointerId); if (pt && !pt.brake) pt.x = p.x;
  if (e.pointerType === 'mouse') mouseX = p.x;
});
const up = e => pointers.delete(e.pointerId);
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
let mouseX = null;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowleft','arrowright','arrowdown','arrowup','a','d','s',' '].includes(k)) { keys[k] = true; usedInput = true; mouseX = null; e.preventDefault(); }
  if ((k === ' ' || k === 'enter') && (state==='over' || paused)) tapAction();
  if (k === 'h') sfx.honk();
  if (k === 'p' || k === 'escape') togglePause();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
document.getElementById('mute').onclick = e => { muted = !muted; store.set('jam-muted', muted?'1':'0'); e.target.textContent = muted?'🔇':'🔊'; };
document.getElementById('mute').textContent = muted?'🔇':'🔊';
document.getElementById('pause').onclick = () => togglePause();
document.addEventListener('visibilitychange', () => { if (document.hidden && state==='play') { paused = true; updPause(); } });
function togglePause(){ if (state!=='play') return; paused = !paused; updPause(); }
function updPause(){ document.getElementById('pause').textContent = paused ? '▶' : '⏸'; }
function tapAction(){ if (state === 'over' && overT > 0.8) reset(); else if (paused) { paused = false; updPause(); } }
function braking(){
  if (keys['arrowdown'] || keys['s'] || keys[' ']) return true;
  for (const p of pointers.values()) if (p.brake) return true;
  return false;
}
function steerTarget(){
  for (const p of pointers.values()) if (!p.brake && !p.mouse) return p.x;
  for (const p of pointers.values()) if (!p.brake && p.mouse) return p.x;
  return mouseX;
}

// ---------- state ----------
let state, paused = false, overT = 0, lastT, overLine = '';
let P, objs, parts, dist, score, lives, invuln, nextRow, nextJam, shake, flashT, shots, scroll = 0, jamsSeen;
const VMAX = 360;
const rnd = (a,b) => a + Math.random()*(b-a);
const CAR_COLS = ['#e6e6e6','#3a6ea5','#2e2e2e','#b8bec6','#7a1f2b','#e2b13c','#4f7a4a','#ffffff','#a9c4e0'];

function reset(){
  P = { x: LANE_MINE, y: 640, v: 200, vx: 0, tilt: 0, spin: 0 };
  objs = []; parts = [];
  dist = 0; score = 0; lives = 3; invuln = 1.5; nextRow = 0; nextJam = 420; shake = 0; flashT = 0; shots = 0; scroll = 0; jamsSeen = 0;
  state = 'play'; paused = false; updPause(); overT = 0;
  // a few trees to start
  for (let y = -100; y < H; y += 70) spawnScenery(y);
  say('start', true);
}

const SIGNS = ['Scenic viewpoint 1 km','Wildlife next 20 km — slow down','Please stay in your vehicle','Halifax 4,850 km →','Do not feed the wildlife','River access ↙'];
let signIdx = 0;
function spawnScenery(y){
  if (Math.random() < .8) objs.push({ t:'tree', x: rnd(110, 128), y: y + rnd(-25,25), s: rnd(.75,1.05) });
  objs.push({ t:'tree', x: rnd(370, 460), y: y + rnd(-25,25), s: rnd(.85,1.25) });
  if (Math.random() < .6) objs.push({ t:'tree', x: rnd(390, 480), y: y + rnd(-25,25), s: rnd(.85,1.25) });
  if (Math.random() < .7) objs.push({ t:'flowers', x: rnd(352, 470), y: y + rnd(-30,30), seed: Math.random()*1000 });
  if (Math.random() < .25) objs.push({ t:'boulder', x: rnd(362, 470), y: y + rnd(-30,30), s: rnd(.7,1.2) });
  if (Math.random() < .05) objs.push({ t:'sign', x: 356, y, text: SIGNS[signIdx++ % SIGNS.length] });
}
function free(x, y, h){ return !objs.some(q => q.t==='car' && Math.abs(q.x - x) < 40 && Math.abs(q.y - y) < (q.h + h)/2 + 28); }
function addCar(c){ if (free(c.x, c.y, c.h)) { objs.push(c); return true; } return false; }
function mkCar(x, y, dir, u, extra){
  const big = Math.random();
  const kind = big < .12 ? 'rv' : big < .2 ? 'bus' : 'car';
  const h = kind==='car' ? 58 : kind==='rv' ? 92 : 104, w = kind==='car' ? 34 : 40;
  return Object.assign({ t:'car', kind, x, y, w, h, dir, u, cruise: u, col: kind==='rv' ? '#f1ead8' : kind==='bus' ? '#d9dde3' : CAR_COLS[Math.random()*CAR_COLS.length|0],
    state:'drive', timer: 0, willBrake: Math.random() < 0.38, hazard:false, people: 0 }, extra||{});
}

function spawnRow(){
  const diff = Math.min(1, dist / 12000);
  const y = -130;
  spawnScenery(y);
  if (dist < 150) return;
  // same-direction traffic ahead of you
  if (Math.random() < 0.28 + diff*0.2) addCar(mkCar(LANE_MINE + rnd(-6,6), y - rnd(0,60), 1, rnd(170, 260)));
  // oncoming traffic
  if (Math.random() < 0.16 + diff*0.22) addCar(mkCar(LANE_OPP + rnd(-6,6), y - rnd(0,80), -1, rnd(220, 300), { willBrake:false }));
  // pickups
  const r = Math.random();
  if (r < 0.09) objs.push({ t:'bit', x: rnd(LANE_OPP-30, LANE_MINE+30), y });
  else if (r < 0.115) objs.push({ t:'coffee', x: rnd(LANE_OPP-30, LANE_MINE+30), y });
}

function spawnJam(){
  jamsSeen++;
  const diff = Math.min(1, dist / 12000);
  const kinds = jamsSeen === 1 ? ['elk'] : ['elk','elk','sheep','bear'];
  const kind = pick(kinds);
  const side = Math.random() < .5 ? -1 : 1;           // which shoulder the animal starts on
  const y = -260;
  const crossing = jamsSeen > 1 && Math.random() < 0.45 + diff*0.25;
  const ax = side < 0 ? 116 : 364;
  objs.push({ t:'animal', kind, x: crossing ? ax : (side<0 ? 118 : 364), y, vx: crossing ? -side * rnd(35, 55) : 0,
    crossing, started:false, spotted:false, hit:false, ph: rnd(0,6), said:false });
  // cars stopped on the shoulder near it, people getting out
  const nPark = 1 + (Math.random() < .5 + diff*.4 ? 1 : 0);
  for (let i=0;i<nPark;i++){
    const sx = Math.random() < .5 ? SH_L : SH_R;
    addCar(mkCar(sx, y + 90 + i*95 + rnd(-10,10), sx===SH_L ? -1 : 1, 0, { state:'parked', hazard:true, willBrake:false, people: 1 + (Math.random()<.4?1:0), kind:'car', h:58, w:34 }));
  }
  // the classic: someone stopped dead in YOUR lane
  if (Math.random() < 0.55 + diff*0.3) addCar(mkCar(LANE_MINE + rnd(-4,4), y + 220, 1, 0, { state:'stopped', hazard:true, timer: rnd(3,6), willBrake:false, people: Math.random() < .5 ? 1 : 0, kind:'car', h:58, w:34 }));
  // and sometimes in the oncoming lane too
  if (Math.random() < 0.35 + diff*0.3) addCar(mkCar(LANE_OPP + rnd(-4,4), y + 140, -1, 0, { state:'stopped', hazard:true, timer: rnd(3,6), willBrake:false, people: Math.random() < .5 ? 1 : 0, kind:'car', h:58, w:34 }));
}

function spawnPerson(car){
  // step out toward the animal / middle of the road
  const leftSide = car.x < MID;
  const tx = leftSide ? rnd(MID-70, MID+10) : rnd(MID-10, MID+70);
  const fromX = car.x + (leftSide ? 22 : -22);
  objs.push({ t:'person', x: fromX, y: car.y + rnd(-10,14), home: fromX, tx, phase:'out', timer: 0, car, col: pick(['#e0447a','#f28c28','#3c8dd9','#7c4dff','#2bb673','#d6402b']) });
}

function puff(x,y,n,col){ for(let i=0;i<n;i++) parts.push({x,y,vx:rnd(-140,140),vy:rnd(-140,60),life:rnd(.4,.9),col}); }
function pop(x,y,text,col){ parts.push({x,y,vx:0,vy:-55,life:1.1,text,col}); }

function hurt(kind){
  if (invuln > 0) return;
  lives--; invuln = 2.2; P.v *= 0.15; P.spin = 0.6; shake = 0.45; flashT = 0.15;
  sfx.crash(); puff(P.x, P.y - 20, 16, '#ddd');
  say(kind === 'animal' ? 'animalhit' : 'crash', true);
  if (lives <= 0) {
    state = 'over'; overT = 0; sfx.over();
    if (Math.floor(score) > best) { best = Math.floor(score); store.set('jam-best', best); }
    overLine = pick(LINES.over); bubble = { text: overLine, t: 2.3 };
  }
}

function boxHit(a, b){ return Math.abs(a.x - b.x) < (a.w + b.w)/2 && Math.abs(a.y - b.y) < (a.h + b.h)/2; }

function update(dt){
  if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  for (const p of parts){ p.x += p.vx*dt; p.y += p.vy*dt; if (!p.text) p.vy += 300*dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (state === 'over') { overT += dt; return; }

  // speed
  const br = braking();
  if (P.spin > 0) { P.spin -= dt; }
  else if (br) P.v = Math.max(0, P.v - 900*dt);
  else P.v = Math.min(VMAX, P.v + (P.v < 200 ? 260 : 120)*dt);
  if (br && P.v > 150 && !P.screeched) { P.screeched = true; sfx.screech(); }
  if (!br) P.screeched = false;

  // steering
  let ax = 0;
  if (keys['arrowleft'] || keys['a']) ax -= 1;
  if (keys['arrowright'] || keys['d']) ax += 1;
  const tgt = steerTarget();
  if (P.spin > 0) P.vx *= 0.9;
  else if (tgt !== null && tgt !== undefined && !ax) {
    const want = Math.max(ROAD_L + 14, Math.min(ROAD_R - 14, tgt - offAt(P.y)));
    P.vx += ((want - P.x) * 8 - P.vx) * Math.min(1, dt*8);
  } else { P.vx += ax * 1500 * dt; P.vx *= Math.pow(0.03, dt); }
  P.vx = Math.max(-380, Math.min(380, P.vx));
  P.x += P.vx * dt;
  P.x = Math.max(ROAD_L + 14, Math.min(ROAD_R - 14, P.x));
  P.tilt += ((P.vx/380) - P.tilt) * Math.min(1, dt*10);

  invuln = Math.max(0, invuln - dt); shake = Math.max(0, shake - dt); flashT = Math.max(0, flashT - dt);

  const dy = P.v * dt;
  dist += dy / 4; score += dy / 25; scroll += dy;

  nextRow -= dy;
  while (nextRow <= 0) { spawnRow(); nextRow += 120 - Math.min(30, dist/500); }
  nextJam -= dy / 4;
  if (nextJam <= 0) { spawnJam(); nextJam = rnd(380, 620) - Math.min(180, dist/60); }

  const me = { x: P.x, y: P.y, w: 30, h: 52 };
  const newObjs = [];
  for (const o of objs){
    // world scroll
    o.y += dy;
    if (o.t === 'car') {
      if (o.state === 'drive' && o.willBrake && o.dir === 1 && o.y > 120 && o.y < 420) { o.state = 'braking'; o.willBrake = false; if (o.y < P.y - 80) say('brake'); }
      if (o.state === 'braking') { o.u = Math.max(0, o.u - 520*dt); if (o.u === 0) { o.state = 'stopped'; o.timer = rnd(1.6, 3); o.hazard = Math.random() < .5; if (Math.random() < .35) o.people = 1; } }
      if (o.state === 'stopped' || o.state === 'parked') {
        if (o.people > 0 && o.y > 60 && o.y < P.y - 40) { o.people--; spawnPerson(o); }
        if (o.state === 'stopped') { o.timer -= dt; if (o.timer <= 0 && !objs.some(p => p.t==='person' && p.car===o)) { o.state = 'go'; o.hazard = false; } }
      }
      if (o.state === 'go') { if (!o.cruise) o.cruise = 220; o.u = Math.min(o.cruise, o.u + 160*dt); }
      o.y += o.dir === 1 ? -o.u*dt : o.u*dt;
      if (o.dir === -1 && o.state === 'drive' && !o.saidClose && Math.abs(o.x - P.x) < 40 && o.y > P.y - 220 && o.y < P.y) { o.saidClose = true; say('oncoming'); }
      // keep same-dir traffic from driving through each other
      if (o.state === 'drive' || o.state === 'go' || o.state === 'braking') {
        if (o.state === 'drive') o.u = Math.min(o.cruise, o.u + 120*dt);
        for (const q of objs) {
          if (q === o || q.t !== 'car' || q.dir !== o.dir || Math.abs(q.x - o.x) > 36) continue;
          const ahead = o.dir === 1 ? q.y < o.y : q.y > o.y;
          if (ahead && Math.abs(o.y - q.y) < (o.h+q.h)/2 + 26) o.u = Math.min(o.u, q.u);
        }
        // don't rear-end the player from behind
        if (o.dir === 1 && o.y > P.y && Math.abs(o.x - P.x) < 40 && o.y - P.y < (o.h+58)/2 + 30) o.u = Math.min(o.u, P.v);
      }
      if (!o.ghost && invuln <= 0 && boxHit(me, { x:o.x, y:o.y, w:o.w-4, h:o.h-6 })) { hurt('car'); o.dented = true; o.ghost = true; }
    }
    else if (o.t === 'person') {
      if (o.phase === 'out') { const d = o.tx - o.x; o.x += Math.sign(d) * 48 * dt; if (Math.abs(d) < 3) { o.phase = 'photo'; o.timer = rnd(1.2, 2.2); } if (!o.said && o.y > 150) { o.said = true; if (Math.random()<.6) say('person'); } }
      else if (o.phase === 'photo') { o.timer -= dt; if (Math.random() < dt*2.5) parts.push({ x:o.x, y:o.y-14, vx:0, vy:0, life:.12, flash:true }); if (o.timer <= 0) o.phase = 'back'; }
      else if (o.phase === 'back') { const d = o.home - o.x; o.x += Math.sign(d) * 55 * dt; if (Math.abs(d) < 3) o.gone = true; }
      if (!o.gone && invuln <= 0 && boxHit(me, { x:o.x, y:o.y, w:12, h:14 })) { hurt('person'); o.gone = true; puff(o.x,o.y,8,'#fff'); pop(o.x, o.y-20, 'They\'re okay! Rattled.', '#a22'); }
    }
    else if (o.t === 'animal') {
      o.ph += dt * (o.vx ? 8 : 2);
      if (o.crossing && !o.started && o.y > 60) o.started = true;
      if (o.started) o.x += o.vx * dt;
      if (o.y > 40 && !o.said) { o.said = true; say(o.kind, true); }
      const ab = o.kind==='elk' ? {w:44,h:22} : o.kind==='bear' ? {w:38,h:26} : {w:30,h:20};
      if (!o.hit && invuln <= 0 && boxHit(me, { x:o.x, y:o.y, w:ab.w, h:ab.h })) { hurt('animal'); o.hit = true; o.vx = (o.x < P.x ? -1 : 1) * 180; o.crossing = true; o.started = true; }
      // photo op: pass it while going slow-ish and not crashing
      if (!o.spotted && !o.hit && o.y > P.y) {
        o.spotted = true;
        const kmh = P.v / 5;
        const base = o.kind === 'bear' ? 150 : o.kind === 'sheep' ? 80 : 60;
        const slow = kmh < 45;
        const pts = slow ? base * 2 : base;
        score += pts; shots++; sfx.snap(); flashT = 0.06;
        pop(P.x, P.y - 60, (slow ? '📸 Nice shot! +' : '📸 Drive-by +') + pts, '#1c5a2f');
        if (slow) say('shot');
      }
    }
    else if (o.t === 'bit' || o.t === 'coffee') {
      if (Math.abs(o.x - P.x) < 28 && Math.abs(o.y - P.y) < 36) {
        o.gone = true;
        if (o.t === 'bit') { score += 15; sfx.bit(); pop(o.x, o.y, '+15 Timbit', '#7a4a1c'); }
        else { score += 40; sfx.coffee(); pop(o.x, o.y, '+40 Double-double', '#6b3a1a'); say('coffee', true); if (lives < 3 && Math.random() < .35) { lives++; pop(o.x, o.y+22, '+1 spare tire', '#2f4a36'); } }
      }
    }
    const offBottom = o.y > H + 160, offTop = o.y < -500;
    if (!o.gone && !offBottom && !offTop && !(o.t==='animal' && (o.x < -60 || o.x > W+60))) newObjs.push(o);
  }
  objs = newObjs;
  // final guarantee: cars in the same lane never overlap — the one behind gets nudged back
  const cars = objs.filter(o => o.t === 'car');
  for (let i=0;i<cars.length;i++) for (let j=i+1;j<cars.length;j++){
    const a = cars[i], b = cars[j];
    if (a.dir !== b.dir || Math.abs(a.x - b.x) > 36) continue;
    const need = (a.h + b.h)/2 + 6;
    if (Math.abs(a.y - b.y) >= need) continue;
    const lead = a.dir === 1 ? (a.y < b.y ? a : b) : (a.y > b.y ? a : b), tail = lead === a ? b : a;
    tail.y = lead.y + (tail.dir === 1 ? need : -need);
    tail.u = Math.min(tail.u, lead.u);
  }
}

function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }

function render(){
  cx.save();
  if (shake>0) cx.translate(rnd(-6,6)*shake*2, rnd(-6,6)*shake*2);
  drawRoad();
  const at = (o, fn) => { cx.save(); cx.translate(offAt(o.y), 0); fn(o); cx.restore(); };
  for (const o of objs) if (o.t==='flowers') at(o, drawFlowers); else if (o.t==='boulder') at(o, drawBoulder);
  for (const o of objs) if (o.t==='bit') at(o, drawBit); else if (o.t==='coffee') at(o, drawCoffee);
  for (const o of objs) if (o.t==='car') at(o, q => drawCar(q, false));
  const blink = invuln > 0 && Math.floor(invuln*10)%2===0 && state==='play';
  if (!blink) at(P, () => drawCar({ x:P.x, y:P.y, w:34, h:58, dir:1, col:'#b8332c', kind:'car', state: braking() ? 'braking' : 'drive' }, true));
  for (const o of objs) if (o.t==='animal') at(o, drawAnimal);
  for (const o of objs) if (o.t==='person') at(o, drawPerson);
  for (const o of objs) if (o.t==='tree') at(o, drawTree); else if (o.t==='sign') at(o, drawSign);
  for (const p of parts){
    cx.save(); cx.translate(offAt(p.y), 0);
    cx.globalAlpha = Math.max(0, Math.min(1, p.life*1.5));
    if (p.flash) { cx.fillStyle='#fff'; cx.beginPath(); cx.arc(p.x,p.y,9,0,7); cx.fill(); }
    else if (p.text) { cx.fillStyle=p.col; cx.font='bold 16px system-ui'; cx.textAlign='center'; cx.strokeStyle='rgba(255,255,255,.9)'; cx.lineWidth=4; cx.strokeText(p.text,p.x,p.y); cx.fillText(p.text,p.x,p.y); }
    else { cx.fillStyle=p.col; cx.beginPath(); cx.arc(p.x,p.y,3,0,7); cx.fill(); }
    cx.restore();
  }
  cx.globalAlpha = 1;
  drawBubble();
  cx.restore();
  if (flashT>0) { cx.fillStyle=`rgba(255,255,255,${flashT*3})`; cx.fillRect(0,0,W,H); }
  drawHeader(); drawBrake(); drawHint(); drawOver(); drawPaused();
}

function loop(t){
  const dt = Math.min(.05, (t - (lastT||t))/1000); lastT = t;
  if (!paused) update(dt);
  render();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
window.__jam = { get state(){return state;}, get score(){return score;}, get lives(){return lives;}, get dist(){return dist;}, get shots(){return shots;}, get objs(){return objs;} };
})();
</script>
