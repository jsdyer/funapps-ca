<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>One Bar — Dead Zone: Trans-Canada</title>
<meta name="description" content="Vancouver to Nan's in Halifax for Christmas Eve. 5,725 km. Darrell's driving. You're on the phone — and you've got one bar. A funapps.ca road-trip game.">
<meta property="og:title" content="One Bar — Dead Zone: Trans-Canada">
<meta property="og:description" content="Vancouver to Halifax for Christmas. 5,725 km of mountains, prairie and dead zones. Keep Mom from calling the RCMP.">
<meta property="og:image" content="og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b1020">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cy:#4ff3ff;--ok:#5cff9d;--warn:#ffcc4d;--bad:#ff5a6a;--roam:#6aa8ff;--ink:#e8eefc;--dim:#8a96b3;--panel:rgba(9,13,27,.74)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070f;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
a{color:var(--cy)}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 370px}
#scene{position:relative;overflow:hidden;min-height:0;background:#0b1020}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
/* HUD */
#hud{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:7px;pointer-events:none;align-items:stretch;z-index:2}
.pill{background:var(--panel);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:6px 11px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.pill small{font-size:9.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-weight:700;white-space:nowrap}
.leg{flex:1 1 200px}
.leg b{font-family:Bungee,Inter,sans-serif;font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg span{font-size:11.5px;color:#b9c4de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:4px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ff5a6a)}
.sig{flex-direction:row;align-items:center;gap:9px;transition:background .2s}
.bigbars{display:flex;align-items:flex-end;gap:3px;height:28px}
.bigbars i{width:7px;border-radius:2px;background:rgba(255,255,255,.14);transition:background .15s}
.bigbars i:nth-child(1){height:22%}.bigbars i:nth-child(2){height:40%}.bigbars i:nth-child(3){height:58%}.bigbars i:nth-child(4){height:78%}.bigbars i:nth-child(5){height:100%}
.bigbars i.on{background:var(--ok)}
.sig.b1 .bigbars i.on{background:var(--bad)}.sig.b2 .bigbars i.on{background:var(--warn)}
.sig.roam .bigbars i.on{background:var(--roam)}
.sig .lbl{display:flex;flex-direction:column;min-width:74px}
.sig .lbl b{font-size:13px;font-weight:800;white-space:nowrap}
.sig.none{background:rgba(70,10,20,.78);animation:pulse 1.1s infinite}
.sig.air{background:rgba(70,48,10,.8)}
.sig .boost{font-size:11px;font-weight:800;color:var(--cy);opacity:0;transition:opacity .15s}
.sig.holding .boost{opacity:1}
.spd{align-items:center;min-width:62px}
.spd b{font-family:Bungee,Inter;font-weight:400;font-size:17px;line-height:1}
.spd.fast b{color:var(--warn)}.spd.slow b{color:var(--cy)}
.worry{flex-direction:row;align-items:center;gap:8px}
#momFace{font-size:22px;line-height:1}
.worry .wm{display:flex;flex-direction:column;gap:4px}
.meter{width:74px;height:7px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5cff9d,#ffcc4d 55%,#ff5a6a);background-size:74px 100%}
.worry.panic{animation:pulse .6s infinite;background:rgba(90,10,20,.8)}
.clock b{font-size:12.5px;font-weight:800;white-space:nowrap}
.clock.late b{color:var(--warn)}
.score{align-items:flex-end;min-width:70px}
.score b{font-family:Bungee,Inter;font-weight:400;font-size:16px;line-height:1.05}
#radarWrap{flex:1 1 100%;padding:4px 8px 5px;flex-direction:row;align-items:center;gap:8px}
#radarWrap small{writing-mode:horizontal-tb}
#radar{flex:1;height:22px;display:block;min-width:0}
@keyframes pulse{50%{filter:brightness(1.35)}}
/* in-scene messages */
#toasts{position:absolute;left:50%;top:46%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:3;width:90%}
.toast{background:rgba(8,12,24,.86);border:1px solid rgba(255,255,255,.12);padding:7px 13px;border-radius:12px;font-weight:800;font-size:14px;animation:toast 1.9s forwards;white-space:nowrap;text-align:center}
.toast.good{color:var(--ok);border-color:rgba(92,255,157,.35)}.toast.bad{color:var(--bad);border-color:rgba(255,90,106,.4)}.toast.warn{color:var(--warn)}.toast.info{color:var(--cy)}
@keyframes toast{0%{opacity:0;transform:translateY(10px) scale(.9)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
#banner{position:absolute;left:50%;top:33%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:3;opacity:0;transition:opacity .5s;padding:14px 22px;background:rgba(6,9,20,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-radius:20px;width:max-content;max-width:92%}
#banner.show{opacity:1}
#banner small{display:block;font-weight:800;letter-spacing:.2em;color:var(--warn);font-size:12px}
#banner b{display:block;font-family:Bungee,Inter;font-weight:400;font-size:clamp(22px,4.4vw,44px);text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 30px rgba(0,0,0,.5);line-height:1.1;margin:4px 0}
#banner span{display:inline-block;font-weight:700;font-size:clamp(13px,1.6vw,17px);color:#d8e0f3}
#hint{position:absolute;left:14px;right:14px;bottom:96px;background:#fff;color:#0b1020;font-weight:800;font-size:13.5px;line-height:1.35;padding:10px 14px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(12px);transition:all .3s;pointer-events:none;z-index:4;text-align:center}
#hint.show{opacity:1;transform:none}
#hint::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
#topBtns{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:3}
#topBtns button{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:var(--panel);font-size:16px}
/* Phone */
#phone{display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(circle at 50% 30%,#18203a,#070a14);min-height:0}
.handset{position:relative;width:100%;max-width:350px;height:100%;max-height:760px;background:#0a0e18;border:2px solid #2b3246;border-radius:38px;box-shadow:0 0 0 6px #121726,0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;padding:10px 12px 12px}
.status{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;padding:3px 10px 7px}
.status .r{display:flex;align-items:center;gap:6px}
#carrier{font-weight:700;color:#cfd6e6;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#carrier.roam{color:var(--roam)}#carrier.none{color:var(--bad)}
.sbars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.sbars i{width:3px;background:#3a4258;border-radius:1px}
.sbars i:nth-child(1){height:30%}.sbars i:nth-child(2){height:50%}.sbars i:nth-child(3){height:70%}.sbars i:nth-child(4){height:85%}.sbars i:nth-child(5){height:100%}
.sbars i.on{background:#fff}
.battery{width:25px;height:12px;border:1.5px solid #cfd6e6;border-radius:3px;position:relative;padding:1px}
.battery i{display:block;height:100%;background:var(--ok);border-radius:1px;width:70%}
.battery::after{content:'';position:absolute;right:-4px;top:3px;width:2px;height:4px;background:#cfd6e6;border-radius:0 1px 1px 0}
.battery.low i{background:var(--bad)}.battery.mid i{background:var(--warn)}
.status.lowbatt #battPct{color:var(--bad);animation:pulse .8s infinite}
.chathead{display:flex;align-items:center;gap:8px;padding:6px 6px 8px 8px;border-bottom:1px solid rgba(255,255,255,.07)}
.chathead .t{font-weight:800;flex:1;display:flex;flex-direction:column;min-width:0}
.chathead .t small{font-weight:600;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btnAir{border:1px solid rgba(255,255,255,.16);background:#141a2a;border-radius:12px;padding:6px 10px;font-size:12px;font-weight:800;white-space:nowrap}
#btnAir.on{background:#ffb347;color:#1b1200;border-color:#ffb347}
#btnAir.suggest{animation:pulse .7s infinite;border-color:#ffb347}
#cards{flex:1;display:flex;flex-direction:column;gap:8px;padding:10px 2px 6px;overflow:hidden;min-height:0}
.card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:#141b2c;border:1.5px solid rgba(255,255,255,.07);border-radius:16px;padding:8px 10px;position:relative;animation:pop .25s ease-out;transition:transform .1s,border-color .2s,background .2s;flex-shrink:0}
.card:active{transform:scale(.98)}
.card .av{font-size:22px;width:38px;height:38px;border-radius:50%;background:#1f2840;display:grid;place-items:center;position:relative}
.card .av em{position:absolute;right:-4px;bottom:-3px;font-size:12px;font-style:normal}
.card .from{font-size:12px;font-weight:800;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .req{font-size:9.5px;font-weight:800;color:var(--warn);background:rgba(255,204,77,.12);padding:1px 6px;border-radius:6px;letter-spacing:.02em}
.card .body,.card .msg,.card .st,.card .bar{display:block}
.card .msg{font-size:13px;line-height:1.25;margin-top:2px;color:#d5def2}
.card .st{font-size:11px;color:var(--dim);margin-top:3px;min-height:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bar{height:4px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.card .bar i{display:block;height:100%;width:0;background:var(--cy);transition:width .1s linear}
.card .ring{width:30px;height:30px;transform:rotate(-90deg)}
.card .ring circle{fill:none;stroke-width:4}
.card .ring .bg{stroke:rgba(255,255,255,.08)}
.card .ring .fg{stroke:var(--ok);stroke-linecap:round;stroke-dasharray:94.25;transition:stroke .3s}
.card.mid .ring .fg{stroke:var(--warn)}.card.urgent .ring .fg{stroke:var(--bad)}
.card.urgent{animation:pop .25s ease-out,nudge 1s infinite}
.card .key{position:absolute;top:-7px;left:-3px;font-size:10px;background:#2b3450;border-radius:6px;padding:0 5px;color:#aab6d6;font-weight:800}
.card.active{border-color:var(--cy);background:#0f2438;box-shadow:0 0 0 3px rgba(79,243,255,.12)}
.card.active .st{color:var(--cy)}
.card.waiting{border-color:var(--warn)}.card.waiting .st{color:var(--warn)}
.card.roaming .bar i{background:var(--roam)}
.card.failed .st{color:var(--bad)}
.card.done{border-color:var(--ok);background:#0f2a22;animation:fadeout 1.1s forwards}
.card.done .st{color:var(--ok)}
.card.expired{border-color:var(--bad);background:#2a1016;animation:shake .4s,fadeout 1.1s forwards}
.card.expired .st{color:var(--bad)}
.card.k-call .bar i{background:var(--ok)}
.empty{color:var(--dim);font-size:13px;text-align:center;margin:auto 0;line-height:1.6;font-weight:600}
.empty b{font-size:26px;display:block}
@keyframes pop{from{transform:translateY(8px) scale(.96);opacity:0}}
@keyframes fadeout{0%,60%{opacity:1}100%{opacity:0;transform:translateX(30px)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes nudge{50%{transform:translateX(-2px)}}
.perkrow{display:flex;gap:4px;padding:5px 8px 0;font-size:14px;min-height:0;flex-wrap:wrap}
.perkrow span{background:#141b2c;border-radius:8px;padding:1px 5px}
.controls{display:grid;grid-template-columns:62px minmax(0,1fr) 62px;gap:8px;padding-top:8px}
.pedal{border-radius:18px;border:1.5px solid rgba(255,255,255,.14);background:#121828;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:800;padding:0}
.pedal span{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin-top:2px;font-weight:800}
.pedal.on{background:#0f3146;border-color:var(--cy)}
#btnGive.on{background:#3a2a0c;border-color:var(--warn)}
.hold{position:relative;height:72px;border-radius:20px;border:1.5px solid rgba(79,243,255,.4);background:linear-gradient(#123049,#0c1f33);font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:0 6px}
.hold small{font-weight:700;font-size:10px;color:#9fb4d6}
.hold.on{background:linear-gradient(#1d5677,#12405e);border-color:var(--cy);box-shadow:0 0 18px rgba(79,243,255,.25)}
.hold.tired{opacity:.55;border-color:var(--bad)}
.hold .stam{position:absolute;left:0;bottom:0;height:5px;width:100%;background:rgba(255,255,255,.06)}
.hold .stam i{display:block;height:100%;background:var(--cy);width:100%}
.hold.tired .stam i{background:var(--bad)}
kbd{font-family:inherit;font-size:9px;background:rgba(255,255,255,.12);border-radius:4px;padding:0 4px}
/* Overlays */
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,6,14,.5);z-index:20;padding:16px;overflow:auto}
#ov.show{display:flex}
#ov.clear{background:linear-gradient(rgba(4,6,14,.15),rgba(4,6,14,.6))}
.panel{width:min(580px,100%);background:linear-gradient(#111830f2,#0a0f20f2);border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:26px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;animation:pop .3s;margin:auto}
.panel h2{font-family:Bungee,Inter;font-weight:400;font-size:clamp(22px,4vw,32px);margin:6px 0 4px;line-height:1.1}
.panel h3{margin:18px 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.panel p{margin:8px 0;line-height:1.45;color:#c9d3ea}
.kicker{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--warn)}
.logo{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-top:4px}
.logo h1{font-family:Bungee,Inter;font-weight:400;font-size:clamp(44px,9vw,78px);margin:0;line-height:.9;letter-spacing:.01em;text-shadow:0 4px 0 #ff5a6a33}
.logo .bars{display:flex;align-items:flex-end;gap:5px;height:clamp(40px,7.5vw,66px);padding-bottom:4px}
.logo .bars i{width:clamp(8px,1.4vw,12px);border-radius:3px;background:#2a3350}
.logo .bars i:nth-child(1){height:20%;background:var(--ok);animation:flick 2.3s infinite}.logo .bars i:nth-child(2){height:40%;animation:ghost 2.3s infinite}.logo .bars i:nth-child(3){height:60%}.logo .bars i:nth-child(4){height:80%}.logo .bars i:nth-child(5){height:100%}
@keyframes flick{0%,40%,44%,100%{opacity:1}42%{opacity:.2}}
@keyframes ghost{0%,70%,100%{background:#2a3350}74%,82%{background:var(--warn)}}
.sub{font-family:Bungee,Inter;font-size:clamp(13px,2.2vw,18px);color:var(--warn);letter-spacing:.06em;margin-top:6px}
.how{display:grid;gap:8px;margin:18px 0 6px;text-align:left}
.how div{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.04);border-radius:14px;padding:9px 12px;font-weight:600;font-size:14px}
.how b{font-size:22px;width:28px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 26px;font-weight:800;font-size:17px;background:linear-gradient(#ffcf5c,#ff9f2e);color:#1b1200;box-shadow:0 6px 0 #a25d0d,0 12px 30px rgba(255,160,46,.3);margin:8px 5px 4px}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #a25d0d}
.btn.ghost{background:#1a2238;color:var(--ink);box-shadow:0 4px 0 #0b0f1c}
.btn.big{font-size:21px;padding:16px 38px}
.legsel{margin-top:14px;font-size:12px;color:var(--dim)}
.legsel button{border:1px solid rgba(255,255,255,.14);background:#141b2c;border-radius:9px;width:30px;height:30px;margin:3px;font-weight:800;font-size:12px}
.foot{margin-top:14px;font-size:12px;color:var(--dim)}
.keys{font-size:11.5px;color:var(--dim);margin-top:6px}
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.perk{border:1.5px solid rgba(255,255,255,.12);background:#141b2c;border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .1s,border-color .2s}
.perk:hover{border-color:var(--cy);transform:translateY(-2px)}
.perk b{font-size:30px}.perk strong{font-size:13.5px;line-height:1.2}.perk span{font-size:12px;color:var(--dim);line-height:1.3}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:12px 0 4px}
.stats span{background:rgba(255,255,255,.05);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700}
.tally{margin:14px auto 4px;max-width:360px;text-align:left;font-size:14px}
.tally div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px dashed rgba(255,255,255,.1)}
.tally div.tot{border:0;font-size:20px;font-weight:800;padding-top:10px}
.tally div.tot span:last-child{font-family:Bungee,Inter;font-weight:400;color:var(--warn)}
.rank{font-size:22px;font-weight:800;margin-top:8px}
.more{margin-top:16px;font-size:13px;color:var(--dim)}
.more a{margin:0 6px}
@media (max-aspect-ratio:1/1){
 #app{grid-template-columns:1fr;grid-template-rows:minmax(0,55fr) minmax(0,45fr)}
 #phone{padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
 .handset{max-width:none;max-height:none;border-radius:22px;box-shadow:none;padding:5px 8px 8px}
 .card{padding:6px 9px;gap:8px;border-radius:14px}.card .av{width:32px;height:32px;font-size:19px}.card .msg{font-size:12.5px}.card .st{margin-top:1px}
 #cards{gap:6px;padding-top:7px}
 .hold{height:58px}.controls{grid-template-columns:56px minmax(0,1fr) 56px}
 #hud{left:6px;right:6px;top:6px;gap:5px}.pill{padding:4px 8px;border-radius:11px}
 .leg{flex:1 1 calc(100% - 96px);order:1}.score{order:2;flex:0 0 auto}.sig{order:3;flex:1 1 0;min-width:0}.sig .boost{display:none}.sig .lbl{overflow:hidden}.sig .lbl b{overflow:hidden;text-overflow:ellipsis}.spd{order:4}.worry{order:5}.clock{order:6}#radarWrap{order:7}.leg b{font-size:12px}.worry .wm small,.clock small,.sig .lbl small{display:none}.sig .lbl{min-width:0}.sig{gap:6px}.worry{gap:5px}#momFace{font-size:18px}
 #hint{bottom:80px;font-size:12.5px;padding:8px 12px}
 .worry .meter{width:40px}.worry small,.clock small,.spd small,.score small{font-size:8px;letter-spacing:.04em}.clock b{font-size:11px}.score b{font-size:13px}.spd b{font-size:14px}.spd{min-width:44px}.score{min-width:0}#radarWrap{padding:3px 6px}#radar{height:18px}#radarWrap small{display:none}.sig .lbl b{font-size:11.5px}.bigbars{height:22px}.bigbars i{width:6px}.sig .lbl{min-width:60px}
 .card .key,.keys,.hold kbd,#btnAir kbd{display:none}
 .perks{grid-template-columns:1fr}.perk{flex-direction:row;text-align:left;padding:10px 12px}.perk b{font-size:26px}
 #topBtns{bottom:auto;top:auto;bottom:6px;right:6px}#topBtns button{width:32px;height:32px;font-size:14px}

/* ================= state ================= */
const G={phase:'title',paused:false,leg:0,time:0,t:0,x:0,speed:0,W:null,run:null,tasks:[],inbox:[],activeId:null,
 sig:0,sigRaw:0,bars:0,roaming:false,conn:null,airplane:false,hold:false,holdAmt:0,stamina:100,tired:false,ease:false,give:false,
 nextSpawn:0,hints:{},bubble:null,chat:15,packets:[],puffs:[],flakes:[],offT:0,roamAnnT:0,lastLegStats:null,bump:0,shake:0};
let TID=1;

/* ================= world ================= */
function buildWorld(li){
 const L=LEGS[li],len=L.dur*PXS,towers=[],occ=[],ev=[];let s0=0;
 towers.push({x:110,range:720,pow:5.2,roam:false,town:true});
 L.segs.forEach(s=>{const sx=s0*len,ex=(s0+s.f)*len;s._x0=sx;s._x1=ex;
  if(!s.dead){let tx=sx+rr(s.gap[0],s.gap[1])*.5;while(tx<ex){towers.push({x:tx,range:rr(...s.range),pow:rr(...s.pow),roam:false,town:!!s.town});tx+=rr(s.gap[0],s.gap[1])}}
  if(s.roam){let tx=sx+rr(250,700);while(tx<ex){towers.push({x:tx,range:rr(...s.roam.range),pow:rr(...s.roam.pow),roam:true});tx+=rr(...s.roam.gap)}}
  s0+=s.f});
 towers.push({x:len-60,range:700,pow:5.2,roam:false,town:true});
 (L.fixed||[]).forEach(f=>occ.push({x0:f.f*len,x1:f.f*len+f.len,amt:9,type:f.type,label:f.label}));
 (L.occ||[]).forEach(o=>{let x=o.from*len;const end=o.to*len;while(true){x+=rr(...o.every);const l=rr(...o.len);if(x+l>end)break;const ov=occ.some(q=>x<q.x1+120&&x+l>q.x0-120);if(!ov)occ.push({x0:x,x1:x+l,amt:rr(...o.amt),type:o.type,seed:Math.random()*1000|0});x+=l}});
 occ.sort((a,b)=>a.x0-b.x0);towers.sort((a,b)=>a.x-b.x);
 (L.events||[]).forEach(e=>ev.push(Object.assign({},e,{x:e.f*len,done:false,spawned:false,cross:0,trig:false})));
 return {len,towers,occ,ev,segs:L.segs};
}
function occAt(x){let o=0;for(const q of G.W.occ){const e=q.type==='shed'?16:70;if(x<q.x0-e||x>q.x1+e)continue;let k=1;if(x<q.x0)k=(x-(q.x0-e))/e;else if(x>q.x1)k=((q.x1+e)-x)/e;o+=q.amt*sm(clamp(k,0,1))}return o}
function inShed(x){return G.W.occ.some(q=>q.type==='shed'&&x>q.x0&&x<q.x1)}
function curSeg(){const L=LEGS[G.leg];let a=0;for(const s of L.segs){if(G.x<(a+s.f)*G.W.len)return s;a+=s.f}return L.segs[L.segs.length-1]}
function placeName(){const L=LEGS[G.leg],f=G.x/G.W.len;let n=L.way[0][1];for(const w of L.way)if(f>=w[0]-.02)n=w[1];return n}
function placeShort(){return placeName().split(',')[0]}
const P=r=>G.run&&G.run.perks[r];

/* ================= signal ================= */
function computeSignal(dt){
 let home=0,roam=0,ht=null,rt=null;
 for(const t of G.W.towers){const d=Math.abs(G.x-t.x);if(d>=t.range)continue;const s=t.pow*Math.pow(1-(d/t.range)**2,.6);if(t.roam){if(s>roam){roam=s;rt=t}}else if(s>home){home=s;ht=t}}
 const o=occAt(G.x);
 const n=(noise1(G.time*.8,11)-.5)*1.25+(noise1(G.time*3.4,37)-.5)*.45;
 const boost=G.holdAmt*1.05+(P('booster')?.5:0);
 const hv=home>0?home-o+n+boost:0, rv=roam>0?roam-o+n+boost:0;
 let val,roaming=false,conn=null;
 if(hv>=1||rv<1){val=hv;conn=ht}else{val=rv;roaming=true;conn=rt}
 if(G.airplane){val=0;conn=null;roaming=false}
 G.sigRaw=Math.max(0,val);
 G.sig=lerp(G.sig,G.sigRaw,1-Math.exp(-dt*7));
 const nb=clamp(Math.floor(G.sig),0,5);
 if(nb!==G.bars){if(G.phase==='play'){if(G.bars===0&&nb>0)Sfx.found();else if(nb===0)Sfx.lost()}G.bars=nb}
 G.roaming=roaming&&G.bars>0;G.conn=G.bars>0?conn:null;
}

/* ================= tasks ================= */
function makeTask(tpl){const K=KINDS[tpl.k];const pat=K.pat*(P('patience')?1.3:1);
 return {id:TID++,who:tpl.who,k:tpl.k,m:tpl.m,r:tpl.r,size:K.size,min:K.min,pat,patMax:pat,prog:0,stall:0,low:0,state:'queued',doneT:0,exitX:tpl.exitX||0,exitStart:tpl.exitStart||0,failed:false,status:'',reply:''}}
const live=()=>G.tasks.filter(t=>t.state==='queued');
const reachable=()=>G.bars>=1&&!G.airplane&&G.run.battery>0;
function spawnRandom(){
 const L=LEGS[G.leg];const pool=POOL.concat(L.extra||[],L.extra||[],L.extra||[]);
 const open=new Set(G.tasks.concat(G.inbox).map(t=>t.m));
 const hasCall=G.tasks.concat(G.inbox).some(t=>t.k==='call'&&t.state!=='done'&&t.state!=='expired');
 const W={text:5,photo:2,call:1.4,data:2,big:.7,pay:.6};
 const c=pool.filter(p=>!open.has(p.m)&&!(hasCall&&p.k==='call')&&!G.recent.includes(p.m));
 if(!c.length)return;
 let tot=c.reduce((a,p)=>a+(W[p.k]||1),0),r=Math.random()*tot,ch=c[0];
 for(const p of c){r-=(W[p.k]||1);if(r<=0){ch=p;break}}
 G.recent.push(ch.m);if(G.recent.length>7)G.recent.shift();
 G.inbox.push(ch);
}
function receive(){
 if(!reachable()||!G.inbox.length)return;
 let n=0,ring=false;
 while(G.inbox.length&&live().length<4){const tpl=G.inbox.shift();const t=makeTask(tpl);
  if(t.k==='map'&&P('maps')){G.tasks.push(t);complete(t,true);n++;continue}
  G.tasks.push(t);n++;if(t.k==='call')ring=true;}
 if(!n)return;
 if(ring)Sfx.ring();else if(n>1)Sfx.burst();else Sfx.msg();
 if(n>=2)toast(`📳 ${n} new messages`,'info');
 if(G.leg===0||!G.hints.tap)hint('tap',PORT?'Tap a message to send it ☝️':'Tap a message to send it ☝️ (or press 1–4)');
 if(G.tasks.some(t=>t.k==='call'&&t.state==='queued'))hint('call',`📞 Calls need 2+ bars the whole time. Hold ✋${PORT?'':' (SPACE)'} to hold it up to the window.`);
}
function selectTask(t){
 if(G.phase!=='play'||G.paused||!t||t.state!=='queued')return;
 Sfx.init();Sfx.resume();
 if(G.activeId===t.id)return;
 const a=G.tasks.find(q=>q.id===G.activeId);
 if(a&&a.k==='call'&&a.prog>.4){a.prog=0;a.failed=true;bumpWorry(5);toast('You hung up on '+PEOPLE[a.who].n+' 😬','bad');G.run.streak=1}
 G.activeId=t.id;t.failed=false;t.stall=0;t.low=0;
 if(t.k==='call')Sfx.ring();else Sfx.click();
}
function complete(t,silent){
 const K=KINDS[t.k];const pts=Math.round(K.pts*G.run.streak/10)*10;
 t.state='done';t.doneT=0;t.reply=t.r?t.r(placeShort()):'Done';
 G.run.score+=pts;G.run.streak=Math.min(2,+(G.run.streak+.1).toFixed(2));
 G.run.worry=Math.max(0,G.run.worry-K.relief*(t.who==='nan'?1.2:1));
 G.run.stats.del++;G.legStats.del++;if(t.k==='call')G.run.stats.calls++;if(t.k==='photo')G.run.stats.photos++;
 if(G.activeId===t.id)G.activeId=null;
 if(!silent)Sfx.sent();
 toast(`✓✓ ${t.k==='call'?'Call done':'Delivered'} +${pts}`,'good');
 hint('first',`Nice. Watch for 📡 towers ahead${isPortrait()?'':' (and the “Ahead” strip)'} — more bars = faster sends.`,true);
}
function expire(t){
 t.state='expired';t.doneT=0;t.reply=EXPIRE_LINES[t.who]||'Expired';
 if(t.k==='map'){G.run.clock+=30;G.run.stats.exits++;toast('🚧 Missed the detour! Stuck behind the accident +30 min','bad');say('Should\'ve taken the exit, b\'y.')}
 else{bumpWorry(FAMILY[t.who]||4);toast(t.reply,'bad')}
 G.run.streak=1;G.run.stats.miss++;G.legStats.miss++;
 if(G.activeId===t.id)G.activeId=null;Sfx.fail();
}
function failSend(t){t.prog*=.6;t.stall=0;t.failed=true;G.activeId=null;G.run.streak=1;G.run.stats.fail++;G.legStats.fail++;Sfx.fail();toast('⚠ Not delivered','bad');shakeIt()}
function dropCall(t){t.prog=0;t.low=0;t.failed=true;G.activeId=null;bumpWorry(4);G.run.streak=1;G.run.stats.drop++;G.legStats.drop++;Sfx.drop();toast(`📞 Call dropped! “${t.who==='nan'?'Hello? HELLO?':'...you there?'}”`,'bad');say(pick(['Lost \'er.','Dropped? Again?','Hold it up higher!']));shakeIt()}
function bumpWorry(v){G.run.worry=clamp(G.run.worry+v*(P('find')?.75:1),0,100)}
function shakeIt(){G.shake=.25}

/* ================= flow ================= */
function newRun(start=0){
 G.run={score:0,streak:1,battery:start?70:60,worry:start?12:8,clock:CLOCK_START+SCHED[start],perks:{},roam:0,practice:start>0,
  stats:{del:0,miss:0,drop:0,fail:0,calls:0,photos:0,hold:0,dead:0,tickets:0,exits:0}};
 G.hints={};startLeg(start);
}
function startLeg(i){
 G.leg=i;G.W=buildWorld(i);G.x=0;G.t=0;G.speed=60;G.tasks=[];G.inbox=[];G.activeId=null;G.recent=[];
 G.nextSpawn=LEGS[i].tutorial?999:2.2;G.airplane=false;G.hold=false;G.holdAmt=0;G.stamina=100;G.tired=false;G.ease=G.give=false;
 G.packets=[];G.bubble=null;G.chat=rr(10,16);G.offT=0;G.sig=3;G.bars=3;
 G.legStats={del:0,miss:0,drop:0,fail:0,start:G.run.clock};
 (LEGS[i].script||[]).forEach(s=>s.fired=false);
 G.snapshot=JSON.parse(JSON.stringify(G.run));
 cardEls.forEach(el=>el.remove());cardEls.clear();
 G.phase='play';G.paused=false;hideOv();
 store.set('reached',Math.max(store.get('reached',0),i));
 banner(i);syncPerkRow();
 if(i===0)setTimeout(()=>say('Alright. Halifax or bust.'),1500);
}
function endLeg(){
 G.tasks=G.tasks.filter(t=>t.state==='queued');const leftover=G.tasks.length;G.tasks=[];G.activeId=null;G.inbox=[];syncCards();
 const L=LEGS[G.leg];
 if(L.final){finish();return}
 G.phase='pit';G.speed=0;Sfx.engine(0,false);
 const before=G.run.battery;G.run.battery=Math.min(100,G.run.battery+20);G.run.worry=Math.max(0,G.run.worry-12);G.run.clock+=L.pit.hrs*60;
 showPit(L,before,leftover);
}
function gameOver(kind){
 if(G.phase!=='play')return;G.phase='over';G.activeId=null;Sfx.lose();Sfx.engine(0,false);
 const where=placeName();
 const t=kind==='dead'?{h:'📵 Your phone died.',p:`Somewhere near <b>${where}</b>. Mom couldn't reach you for an hour, so she called the RCMP. Twice.`}
  :{h:'🚓 Mom called the RCMP.',p:`A very polite constable pulled you over near <b>${where}</b>. “Text your mother, please.”`};
 const tips=kind==='dead'?'Tip: tap ✈ Airplane mode in dead zones. Searching for signal eats your battery.':'Tip: Mom worries whenever you\'re offline. Text her back the moment you get bars.';
 showOv(`<div class="panel"><div class="kicker">Leg ${G.leg+1} of 9 · ${LEGS[G.leg].name}</div><h2>${t.h}</h2><p>${t.p}</p><p style="color:var(--dim);font-size:13px">${tips}</p>
 <div class="stats"><span>📨 ${G.run.stats.del} delivered</span><span>⭐ ${G.run.score.toLocaleString()} pts</span></div>
 <button class="btn big" id="bRetry">↻ Retry leg ${G.leg+1}</button><br><button class="btn ghost" id="bMenu">Back to start</button></div>`);
 $('#bRetry').onclick=()=>{Sfx.click();G.run=JSON.parse(JSON.stringify(G.snapshot));startLeg(G.leg)};
 $('#bMenu').onclick=()=>{Sfx.click();toTitle()};
}
function finish(){
 G.phase='win';G.speed=0;Sfx.win();Sfx.engine(0,false);
 const r=G.run,late=r.clock-DEADLINE,onTime=late<=0;
 const bonus=onTime?1000+Math.round(-late*4):0,roamPen=Math.round(r.roam*10),fin=Math.max(0,r.score+bonus-roamPen);
 const best=store.get('best',0);let nb=false;if(!r.practice&&fin>best){store.set('best',fin);nb=true}
 const R=fin>=24000?['🏆 Maritimer of the Year','Nan told the whole church about you.']:fin>=17000?['👵 Nan\'s Favourite','You get the big piece of pie.']:fin>=10000?['🎄 Made it, b\'y','Dinner\'s on. Sit down before it gets cold.']:['📵 Seen at 11:58 PM','Your mother has some notes.'];
 const lateTxt=onTime?`Pulled into Nan's at <b>${fmtClock(r.clock,true)}</b> — ${fmtDur(-late)} before dinner.`:`Pulled in at <b>${fmtClock(r.clock,true)}</b>. You missed dinner by ${fmtDur(late)}. Nan saved you a plate.`;
 const share=`I made it Vancouver → Halifax in One Bar 📶 — ${fin.toLocaleString()} pts (${R[0].replace(/^\S+\s/,'')}). ${location.host||'funapps.ca'}`;
 showOv(`<div class="panel"><div class="kicker">Christmas Eve · Halifax, NS</div><h2>You made it to Nan's. 🎄</h2><p>${lateTxt}</p>
 <div class="tally"><div><span>Messages, calls & pics</span><span>${r.score.toLocaleString()}</span></div><div><span>On-time bonus</span><span>${bonus?'+'+bonus.toLocaleString():'—'}</span></div><div><span>Roaming bill ($${r.roam.toFixed(2)})</span><span>${roamPen?'−'+roamPen.toLocaleString():'—'}</span></div><div class="tot"><span>Final</span><span>${fin.toLocaleString()}</span></div></div>
 <div class="rank">${R[0]}</div><p>${R[1]}${r.practice?' <i>(Practice run, so it\'s not saved as your best.)</i>':nb?' <b style="color:var(--ok)">New best!</b>':best?` Best: ${best.toLocaleString()}`:''}</p>
 <div class="stats"><span>📨 ${r.stats.del} delivered</span><span>📞 ${r.stats.calls} calls</span><span>📷 ${r.stats.photos} pics</span><span>💔 ${r.stats.drop} dropped</span><span>😤 ${r.stats.miss} ignored</span><span>🚓 ${r.stats.tickets} tickets</span></div>
 <button class="btn big" id="bAgain">Drive it again ▶</button><button class="btn ghost" id="bShare">Share</button>
 <div class="more">More from <a href="https://funapps.ca">funapps.ca</a> · <a href="https://donair.funapps.ca">Donair Drop</a> · <a href="https://clams.funapps.ca">Clams &amp; Chips</a></div></div>`);
 $('#bAgain').onclick=()=>{Sfx.click();newRun(0)};
 $('#bShare').onclick=async()=>{try{if(navigator.share){await navigator.share({text:share});return}await navigator.clipboard.writeText(share);$('#bShare').textContent='Copied ✓'}catch(e){}};
}
function toTitle(){G.phase='title';G.leg=0;G.W=buildWorld(0);G.x=300;G.speed=100;G.tasks=[];G.activeId=null;cardEls.forEach(el=>el.remove());cardEls.clear();G.run=null;showTitle()}

/* ================= update ================= */
function update(dt){
 G.time+=dt;
 if(G.phase==='title'){G.speed=100;G.x+=PXS*dt;if(G.x>G.W.len-900)G.x=300;computeSignal(dt);return}
 if(G.phase!=='play'||G.paused){G.speed=approach(G.speed,0,120*dt);G.x+=G.speed/CRUISE*PXS*dt*.3;return}
 const L=LEGS[G.leg],W=G.W,R=G.run;G.t+=dt;
 // --- speed & events
 const cruise=P('coffee')?110:100;let target=G.ease?60:G.give?130:cruise,cap=999;
 for(const e of W.ev){
  if(e.type==='cones'&&G.x>e.x-60&&G.x<e.x+e.len){cap=Math.min(cap,60);if(!e.trig){e.trig=true;say(pick(['Cones. Always cones.','Construction. In December.','Travaux! Of course.']))}}
  if((e.type==='moose'||e.type==='elk')){if(!e.trig&&e.x-G.x<560&&G.x<e.x+40){e.trig=true;toast(e.type==='moose'?'🫎 MOOSE! Darrell slows right down.':'🦌 Elk on the road!','warn');say(e.type==='moose'?'MOOSE! Hang on!':'Elk! Don\'t pet it.');Sfx.honk()}
   if(e.trig&&e.cross<1){e.cross+=dt/4.2;if(G.x>e.x-560&&G.x<e.x+80)cap=Math.min(cap,38)}}

function drawRadar(){if(!G.W||G.phase==='title')return;const w=radar.width,h=radar.height,c=rctx;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,w,h);const span=2900,back=260,x0=G.x-back,sx=wx=>(wx-x0)/span*w;

const el={legName:$('#legName'),place:$('#place'),legProg:$('#legProg'),sigPill:$('#sigPill'),sigTxt:$('#sigTxt'),sigSub:$('#sigSub'),spd:$('#spd'),spdPill:$('#spdPill'),momFace:$('#momFace'),worryBar:$('#worryBar'),worryPill:$('#worryPill'),clock:$('#clock'),clockPill:$('#clockPill'),score:$('#score'),streak:$('#streak'),pTime:$('#pTime'),carrier:$('#carrier'),net:$('#net'),battIcon:$('#battIcon'),battPct:$('#battPct'),status:$('#status'),btnAir:$('#btnAir'),btnHold:$('#btnHold'),stamBar:$('#stamBar'),btnEase:$('#btnEase'),btnGive:$('#btnGive'),cards:$('#cards'),chatSub:$('#chatSub')};
const bigBars=[...document.querySelectorAll('#bigBars i')],sBars=[...document.querySelectorAll('#sBars i')];
const cache=new Map();const setT=(e,v)=>{if(cache.get(e)!==v){cache.set(e,v);e.textContent=v}};const setH=(e,v)=>{const k='h';if(e['_'+k]!==v){e['_'+k]=v;e.innerHTML=v}};const setS=(e,p,v)=>{const k='_s'+p;if(e[k]!==v){e[k]=v;e.style[p]=v}};const setC=(e,c,on)=>{e.classList.toggle(c,!!on)};
const MONTH=['Dec 21','Dec 22','Dec 23','Dec 24','Dec 25','Dec 26'];
function fmtClock(m,long){m=Math.floor(m);const d=Math.floor(m/1440),mm=m%1440,h=Math.floor(mm/60),mi=mm%60,ap=h>=12?'PM':'AM',h12=((h+11)%12)+1;return `${MONTH[clamp(d,0,5)]} · ${h12}:${String(mi).padStart(2,'0')} ${ap}`}
function fmtTiny(m){m=Math.floor(m);const d=Math.floor(m/1440),mm=m%1440,h=Math.floor(mm/60),mi=mm%60;return `${MONTH[clamp(d,0,5)]} ${((h+11)%12)+1}:${String(mi).padStart(2,'0')}${h>=12?'p':'a'}`}
function fmtShort(m){m=Math.floor(m)%1440;const h=Math.floor(m/60),mi=m%60;return `${((h+11)%12)+1}:${String(mi).padStart(2,'0')}`}
function fmtDur(m){m=Math.round(Math.abs(m));const h=Math.floor(m/60),mi=m%60;return h?`${h} h ${mi} min`:`${mi} min`}
function updateHUD(){
 if(!G.W)return;const R=G.run,L=LEGS[G.leg];
 if(!R){return}
 setT(el.legName,`Leg ${G.leg+1}/9 · ${L.name}`);setT(el.place,'Near '+placeName());setS(el.legProg,'width',(clamp(G.x/G.W.len,0,1)*100).toFixed(1)+'%');
 const b=G.bars;bigBars.forEach((e,i)=>setC(e,'on',i<b));sBars.forEach((e,i)=>setC(e,'on',i<b));
 const sp=el.sigPill;setC(sp,'none',b===0&&!G.airplane);setC(sp,'air',G.airplane);setC(sp,'b1',b===1);setC(sp,'b2',b===2);setC(sp,'roam',G.roaming);setC(sp,'holding',G.holdAmt>.5);
 setT(el.sigTxt,G.airplane?'✈ Airplane':b===0?'No Service':G.roaming?`${NETS[b]} · ROAMING`:`${b} bar${b>1?'s':''} · ${NETS[b]}`);
 setT(el.sigSub,G.airplane?'battery saver':b===0?'searching… 🔋↓':G.roaming?(P('roam')?'USA · free':'USA · $12/MB 💸'):'LoonieMobile');
 setT(el.spd,String(Math.round(G.speed)));setC(el.spdPill,'fast',G.speed>112);setC(el.spdPill,'slow',G.speed<80);
 const w=R.worry;setT(el.momFace,w<25?'😊':w<50?'🙂':w<70?'😟':w<88?'😰':'😱');setS(el.worryBar,'width',w.toFixed(1)+'%');setC(el.worryPill,'panic',w>=85);
 setT(el.clock,PORT?fmtTiny(R.clock):fmtClock(R.clock));setC(el.clockPill,'late',R.clock>projectedSlack());
 setT(el.score,R.score.toLocaleString());setT(el.streak,`streak ×${R.streak.toFixed(1)}`);
 setT(el.pTime,fmtShort(R.clock));
 setT(el.carrier,G.airplane?'✈':b===0?'Searching…':G.roaming?'ROAMING':'LoonieMobile');setC(el.carrier,'roam',G.roaming);setC(el.carrier,'none',b===0&&!G.airplane);
 setT(el.net,G.airplane||b===0?'':NETS[b]);
 const bt=R.battery;setS(el.battIcon.firstChild,'width',bt.toFixed(0)+'%');setC(el.battIcon,'low',bt<20);setC(el.battIcon,'mid',bt>=20&&bt<40);setT(el.battPct,Math.ceil(bt)+'%');setC(el.status,'lowbatt',bt<15);
 setC(el.btnAir,'on',G.airplane);el.btnAir.setAttribute('aria-pressed',G.airplane);setC(el.btnAir,'suggest',G.offT>2&&!G.airplane&&G.phase==='play');
 setC(el.btnHold,'on',G.holdAmt>.5);setC(el.btnHold,'tired',G.tired);setS(el.stamBar,'width',G.stamina.toFixed(0)+'%');
 setC(el.btnEase,'on',G.ease);setC(el.btnGive,'on',G.give);
 syncCards();
}
function projectedSlack(){// clock is "late" if, at cruise from here, you'd miss dinner
 if(!G.run)return 1e9;const L=LEGS[G.leg];let rem=(1-G.x/G.W.len)*L.km/CRUISE*60;for(let i=G.leg+1;i<LEGS.length;i++)rem+=LEGS[i].km/CRUISE*60;for(let i=G.leg;i<LEGS.length-1;i++)rem+=LEGS[i].pit.hrs*60;return DEADLINE-rem}
const cardEls=new Map();let emptyEl=null;
function makeCard(t){const b=document.createElement('button');b.className='card k-'+t.k;const p=PEOPLE[t.who],K=KINDS[t.k];
 b.innerHTML=`<span class="key"></span><span class="av">${p.a}<em>${{call:'📞',photo:'📷',map:'🗺️',pay:'💸',big:'⬇️',data:'🌐'}[t.k]||''}</em></span><span class="body"><span class="from">${p.n}${K.req?`<span class="req">${K.req}</span>`:''}</span><span class="msg"></span><span class="st"></span><span class="bar"><i></i></span></span><svg class="ring" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15"/><circle class="fg" cx="18" cy="18" r="15"/></svg>`;
 b._msg=b.querySelector('.msg');b._st=b.querySelector('.st');b._bar=b.querySelector('.bar i');b._fg=b.querySelector('.fg');b._key=b.querySelector('.key');b._msg.textContent=t.m;
 b.addEventListener('pointerdown',e=>{e.preventDefault();selectTask(t)});return b}
function syncCards(){
 for(const [id,e] of cardEls){if(!G.tasks.find(t=>t.id===id)){e.remove();cardEls.delete(id)}}
 let qi=0;
 for(const t of G.tasks){let e=cardEls.get(t.id);if(!e){e=makeCard(t);cardEls.set(t.id,e);el.cards.appendChild(e)}
  const act=t.id===G.activeId,q=t.state==='queued';if(q)qi++;
  setT(e._key,q?String(qi):'');
  setC(e,'active',act&&q);setC(e,'waiting',act&&(t.status==='waiting'||t.status==='breaking'));setC(e,'failed',q&&t.failed&&!act);setC(e,'done',t.state==='done');setC(e,'expired',t.state==='expired');setC(e,'roaming',act&&G.roaming);
  let frac=t.k==='map'?clamp((t.exitX-G.x)/Math.max(1,t.exitX-t.exitStart),0,1):clamp(t.pat/t.patMax,0,1);
  setC(e,'mid',q&&frac<.5&&frac>=.25);setC(e,'urgent',q&&frac<.25);
  setS(e._fg,'strokeDashoffset',(94.25*(1-frac)).toFixed(1));setS(e._bar,'width',(clamp(t.prog/t.size,0,1)*100).toFixed(0)+'%');
  let st='';
  if(t.state==='done')st='✓✓ '+t.reply;else if(t.state==='expired')st=t.reply;
  else if(act){st={sending:`Sending… ${Math.floor(t.prog/t.size*100)}%${G.roaming&&!P('roam')?' · 💸 roaming':''}`,waiting:`Waiting for signal… need ${t.min}+ bar${t.min>1?'s':''}`,call:`On the phone · ${Math.floor(t.prog)}s / ${t.size}s`,breaking:'Breaking up… get 2+ bars!',paused:'✈ Paused: airplane mode'}[t.status]||'Starting…'}
  else if(t.failed)st=t.k==='call'?'Call dropped. Tap to call back':'Not delivered ⚠ Tap to retry';
  else if(t.k==='map'){const km=Math.max(0,(t.exitX-G.x)*LEGS[G.leg].km/G.W.len);st=`Exit in ${km.toFixed(0)} km`}
  else if(t.prog>0)st=`${Math.floor(t.prog/t.size*100)}% sent · tap to resume`;
  else st=t.k==='call'?'Tap to call':'Tap to send';
  setT(e._st,st);
 }
 const none=!G.tasks.length&&G.phase==='play';

 const subs=[...new Set(G.tasks.filter(t=>t.state==='queued').map(t=>PEOPLE[t.who].n))];setT(el.chatSub,subs.length?subs.join(', ')+' messaged':'Mom, Dad, Nan, Kayla, Darrell…');
}
function syncPerkRow(){const r=$('#perkRow');const ps=G.run?Object.keys(G.run.perks).filter(k=>k!=='bank'):[];r.innerHTML=ps.map(k=>{const p=PERKS.find(q=>q.id===k);return `<span title="${p.n}: ${p.d}">${p.ic}</span>`}).join('');r.style.display=ps.length?'flex':'none'}
let toastN=0;function toast(text,cls=''){const box=$('#toasts');while(box.children.length>3)box.firstChild.remove();const d=document.createElement('div');d.className='toast '+cls;d.textContent=text;box.appendChild(d);setTimeout(()=>d.remove(),1900)}

const ov=$('#ov');
function showOv(html,clear){ov.innerHTML=html;ov.classList.add('show');ov.classList.toggle('clear',!!clear)}

function showTitle(){
 const reached=store.get('reached',0),best=store.get('best',0);
 let ls='';if(reached>0){ls='<div class="legsel">Practice from a later leg: ';for(let i=0;i<=reached;i++)ls+=`<button data-leg="${i}" title="${LEGS[i].name}">${i+1}</button>`;ls+='</div>'}
 showOv(`<div class="panel" style="background:linear-gradient(#111830e6,#0a0f20e6)"><div class="logo"><span class="bars"><i></i><i></i><i></i><i></i><i></i></span><h1>ONE BAR</h1></div><div class="sub">DEAD ZONE: TRANS-CANADA</div>
 <p style="margin-top:14px">Vancouver to Nan's in Halifax for Christmas Eve.<br><b>5,725 km.</b> Darrell's driving. You're on the phone.</p>
 <div class="how"><div><b>📶</b><span>Tap a message to send it, but only when you've got bars</span></div><div><b>✋</b><span>Hold the phone up to the window for an extra bar</span></div><div><b>✈</b><span>Airplane mode saves battery in dead zones. Mom still worries, though.</span></div></div>

 <div class="keys"><kbd>SPACE</kbd> hold it up · <kbd>1</kbd>–<kbd>4</kbd> send · <kbd>↓</kbd>/<kbd>↑</kbd> ease off / give'r · <kbd>A</kbd> airplane · <kbd>P</kbd> pause</div>
 ${ls}<div class="foot">A <a href="https://funapps.ca">funapps.ca</a> game, from a Maritimer who has driven it${best?` · Best: <b>${best.toLocaleString()}</b>`:''}</div></div>`,true);
 $('#bGo').onclick=()=>{Sfx.init();Sfx.resume();Sfx.click();newRun(0)};

}
function showPit(L,before,leftover){

 const owned=R.perks;let pool=PERKS.filter(p=>!owned[p.id]||p.id==='bank');pool.sort(()=>Math.random()-.5);
 const nextHasRoam=LEGS[G.leg+1].segs.some(s=>s.roam);let choices=pool.slice(0,3);

function pickPerk(id){if(G.phase!=='pit')return;Sfx.click();if(id==='bank')G.run.battery=Math.min(100,G.run.battery+35);else G.run.perks[id]=true;startLeg(G.leg+1)}

el.btnAir.addEventListener('click',toggleAir);
$('#btnMute').onclick=()=>{Sfx.init();Sfx.setMuted(!Sfx.muted);$('#btnMute').textContent=Sfx.muted?'🔇':'🔊'};$('#btnMute').textContent=Sfx.muted?'🔇':'🔊';
$('#btnPause').onclick=()=>togglePause();
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(e.repeat&&e.code!=='Space')return;const k=e.key.toLowerCase();
 if(e.code==='Space'){e.preventDefault();if(G.phase==='play')setHold(true);return}

window.addEventListener('blur',()=>{G.hold=G.ease=G.give=false;togglePause(true)});

let last=performance.now();

 for(let i=0;i<TS;i++){update(dt);if(window.OB_BOT&&G.phase==='play'&&!G.paused)window.OB_BOT(G,api)}
 render(dt);updateHUD();Sfx.engine(G.speed,G.phase==='play'&&!G.paused);requestAnimationFrame(frame)}
const api={selectTask,toggleAir,setHold,pickPerk,newRun,startLeg,LEGS,KINDS};
window.OB={G,api};
resize();G.W=buildWorld(0);G.x=300;showTitle();requestAnimationFrame(frame);
